<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formation Cybersécurité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#12161d; --panel:#1a1f28; --panel-2:#222835; --line:#2e3644;
  --fg:#e3e7ee; --muted:#8e99ac; --accent:#e8a33d; --ok:#4fb286; --bad:#d9646e;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.62;padding-inline:16px;padding-block:0 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto}
img{max-width:100%}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-block:11px;margin-bottom:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:var(--fg);padding:0;margin-right:auto}
.brand span{color:var(--accent)}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mini b{color:var(--fg);font-variant-numeric:tabular-nums}
.gbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex:1 0 100%;margin-top:2px}
.gbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}

h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,6vw,34px);line-height:1.15;margin:2px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:36px 0 10px;text-wrap:balance}
h2 .n{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;letter-spacing:.09em;margin-bottom:3px;font-weight:400}
h3{font-family:var(--display);font-weight:600;font-size:15.5px;margin:22px 0 7px}
p{margin:0 0 13px}
strong{font-weight:500;color:#fff}
code{font-family:var(--mono);font-size:13px;background:#0d1117;padding:1.5px 5px;border-radius:2px;color:#d6b483}
.sub{font-size:15px;color:var(--muted);margin:0 0 22px;max-width:58ch}
.why{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:3px;padding:14px 15px;margin:0 0 26px;font-size:14.5px}
.note{border-left:2px solid var(--line);padding-left:13px;color:var(--muted);font-size:14px;margin:18px 0}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.75;background:#0d1117;border:1px solid var(--line);border-radius:3px;padding:13px;overflow-x:auto;margin:0 0 16px;color:#c7d0de;white-space:pre}
pre b{color:var(--accent);font-weight:500}
pre .c{color:#6b7689}
.tscroll{overflow-x:auto;margin-bottom:16px}
table{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;width:100%}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;font-variant-numeric:tabular-nums}
th{background:var(--panel-2);color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}

/* sommaire */
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:11px;overflow:hidden}
.lvl.cur{border-color:var(--accent)}
.lhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:14px;cursor:pointer}
.num{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:4px 7px;flex:none}
.lhead .tx{flex:1;min-width:0}
.lhead strong{display:block;font-family:var(--display);font-size:15px}
.lhead em{font-style:normal;font-size:12.5px;color:var(--muted)}
.lhead .pc{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.lbody{border-top:1px solid var(--line);padding:6px 0}
.mrow{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:10px 14px;cursor:pointer;min-width:0}
.mrow:hover{background:var(--panel-2)}
.mrow .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted);flex:none}
.mrow.ok .dot{background:var(--ok);border-color:var(--ok)}
.mrow.missing{opacity:.45;cursor:default}
.mrow .mt{min-width:0;flex:1}
.mrow .mt b{display:block;font-weight:500;font-size:14.5px}
.mrow .mt em{font-style:normal;font-size:12.5px;color:var(--muted)}
.mrow .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;flex:none}

/* exercices */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 15px;margin:22px 0}
.tag-ex{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 9px}
.given{font-family:var(--mono);font-size:19px;color:var(--accent);padding:6px 0;word-break:break-all}
.conv{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 150px}
.cell span{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cell input{font-family:var(--mono);font-size:15px;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
.cell input.good{border-color:var(--ok)} .cell input.bad{border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;padding-top:1px}
.opt.good{border-color:var(--ok);background:rgba(79,178,134,.12)} .opt.good .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:rgba(217,100,110,.12)} .opt.bad .k{color:var(--bad)}
.corr{margin-top:13px;padding:13px 14px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.corr[data-ok="1"]{border-left:2px solid var(--ok)}
.corr[data-ok="0"]{border-left:2px solid var(--bad)}
.corr h4{font-family:var(--display);font-size:13px;margin:0 0 7px}
.corr p:last-child{margin-bottom:0}

button.act{font-family:var(--display);font-size:13.5px;font-weight:500;background:var(--accent);color:#17181b;border:0;border-radius:3px;padding:9px 17px;cursor:pointer}
button.act.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.act:hover{filter:brightness(1.08)}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.eval{border:1px solid var(--accent);border-radius:4px;padding:18px 16px;margin:40px 0 0;background:var(--panel)}
.big{font-family:var(--display);font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.gate{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 0}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 18px}
.pbar i{display:block;height:100%;background:var(--accent)}
.err{background:var(--panel);border:1px solid var(--bad);border-left:2px solid var(--bad);border-radius:3px;padding:14px;font-size:14px}
footer{margin-top:34px;font-size:12px;color:var(--muted);font-family:var(--mono);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" id="home">FORMATION<span>·</span>CYBER</button>
    <div class="mini">Modules validés <b id="g-done">0</b> / <b id="g-tot">0</b></div>
    <div class="gbar"><i id="g-bar"></i></div>
  </div>
  <div id="view"></div>
  <footer id="foot">Progression locale. Ouvrir avec un petit serveur : <code>python3 -m http.server</code> à la racine du projet.</footer>
</div>

<script>
/* ============================================================
   MOTEUR — ne contient aucun contenu de cours.
   Le contenu vit dans curriculum.json et modules/<id>.json
   ============================================================ */

const R=n=>Math.floor(Math.random()*n);
const bin8=n=>n.toString(2).padStart(8,"0");
const grp=b=>b.slice(0,4)+" "+b.slice(4);
const hex2=n=>n.toString(16).toUpperCase().padStart(2,"0");
const norm=s=>String(s).replace(/\s+/g,"").toUpperCase();
const ipInt=ip=>ip.split(".").reduce((a,o)=>(a*256)+(+o),0)>>>0;
const intIp=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
const esc=s=>String(s).replace(/&(?![a-z]+;|#)/g,"&amp;");

/* ---------- état ---------- */
const KEY="formation.cyber.v1";
let prog={};
try{const r=localStorage.getItem(KEY); if(r) prog=JSON.parse(r)||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}

let CUR=null, INDEX=[];

/* ============================================================
   GÉNÉRATEURS D'EXERCICES
   Chacun retourne {prompt, given, fields[], answers{}, explain(ok)}
   Pour en ajouter un : écrire make<Nom>() puis l'inscrire dans GENERATORS.
   ============================================================ */

function makeConvBin(){
  const n=R(256);
  return {
    prompt:"Convertis ce nombre décimal en binaire sur 8 bits.",
    given:String(n),
    fields:[{k:"b",label:"Binaire",ph:"0000 0000"}],
    answers:{b:bin8(n)},
    norm:v=>norm(v),
    explain(){
      let s="",rest=n;
      [128,64,32,16,8,4,2,1].forEach(p=>{
        if(rest>=p){s+=`${String(rest).padStart(3)} − <b>${String(p).padStart(3)}</b> = ${String(rest-p).padStart(3)}   → <b>1</b>\n`;rest-=p;}
        else{s+=`${String(rest).padStart(3)}   (${p} > reste)      → <b>0</b>\n`;}
      });
      return `<pre>${s}\n${n} = <b>${grp(bin8(n))}</b></pre>`;
    }
  };
}

function makeConvTriple(){
  const n=R(256);
  const from=["bin","hex","dec"][R(3)];
  const shown= from==="bin"?grp(bin8(n)) : from==="hex"?"0x"+hex2(n) : String(n);
  return {
    prompt:"Donne les trois écritures de cet octet.",
    given:shown,
    fields:[{k:"d",label:"Décimal",ph:"0-255"},{k:"b",label:"Binaire",ph:"0000 0000"},{k:"h",label:"Hexa",ph:"00"}],
    answers:{d:String(n),b:bin8(n),h:hex2(n)},
    norm:(v,k)=>k==="h"?norm(v).replace(/^0X/,""):norm(v),
    explain(){
      const b=bin8(n);
      return `<p>Décimal <b>${n}</b> · Binaire <b>${grp(b)}</b> · Hexa <b>0x${hex2(n)}</b></p>
      <pre>Nibble haut : ${b.slice(0,4)} = ${parseInt(b.slice(0,4),2)} = <b>${hex2(n)[0]}</b>
Nibble bas  : ${b.slice(4)} = ${parseInt(b.slice(4),2)} = <b>${hex2(n)[1]}</b></pre>
      <p>Chaque groupe de 4 bits se traduit indépendamment. Aucun calcul sur l'octet entier n'est nécessaire.</p>`;
    }
  };
}

function makeBitop(){
  const op=["ET","OU","XOR"][R(3)], a=R(256), b=R(256);
  const r= op==="ET"?(a&b): op==="OU"?(a|b):(a^b);
  const rule={ET:"1 seulement si les deux bits valent 1",OU:"1 si au moins un bit vaut 1",XOR:"1 si les deux bits diffèrent"}[op];
  return {
    prompt:`Applique l'opération ${op} bit à bit entre ces deux octets.`,
    given:`${a} ${op} ${b}`,
    fields:[{k:"r",label:"Résultat décimal",ph:"0-255"}],
    answers:{r:String(r)},
    norm:v=>String(v).trim(),
    explain(){
      return `<pre>  ${grp(bin8(a))}   <span class="c">(${a})</span>
  ${grp(bin8(b))}   <span class="c">(${b})</span>
  ─────────── ${op}
  <b>${grp(bin8(r))}</b>   <span class="c">(${r})</span></pre>
      <p>Règle du ${op} : ${rule}. Chaque colonne se traite séparément, il n'y a jamais de retenue.</p>`;
    }
  };
}

function makeSubnet(){
  const prefix=17+R(13);
  const base=((10<<24)>>>0)+(R(256)<<16)+(R(256)<<8)+R(256);
  const mask=(0xFFFFFFFF<<(32-prefix))>>>0;
  const net=(base&mask)>>>0, bc=(net|(~mask>>>0))>>>0;
  const hosts=Math.pow(2,32-prefix)-2, block=Math.pow(2,32-prefix);
  return {
    prompt:"Donne les quatre valeurs de ce réseau.",
    given:`${intIp(base)}/${prefix}`,
    fields:[{k:"n",label:"Adresse réseau",ph:"x.x.x.x"},{k:"m",label:"Masque",ph:"x.x.x.x"},
            {k:"b",label:"Broadcast",ph:"x.x.x.x"},{k:"h",label:"Hôtes adressables",ph:"nombre"}],
    answers:{n:intIp(net),m:intIp(mask),b:intIp(bc),h:String(hosts)},
    norm:v=>String(v).trim(),
    explain(){
      return `<p>Réseau <b>${intIp(net)}</b> · Masque <b>${intIp(mask)}</b> · Broadcast <b>${intIp(bc)}</b> · Hôtes <b>${hosts}</b></p>
      <pre>/${prefix} laisse ${32-prefix} bits d'hôte
taille de bloc = 2^${32-prefix} = <b>${block}</b> adresses
utilisables    = ${block} − 2 = <b>${hosts}</b>   <span class="c">(réseau + broadcast exclus)</span></pre>
      <p>Méthode rapide : la taille de bloc donne directement les bornes. Le réseau est le multiple de ${block} immédiatement inférieur ou égal à l'adresse, le broadcast est la dernière adresse du bloc.</p>`;
    }
  };
}

/* ---------- outils communs aux en-têtes réseau ---------- */
const PROTOS={1:"ICMP",6:"TCP",17:"UDP"};
/* Les ports doivent rester identiques au tableau de la section 5 de n0-2. */
const SERVICES=[
  {p:22,n:"SSH",t:6},{p:25,n:"SMTP",t:6},{p:80,n:"HTTP",t:6},{p:443,n:"HTTPS",t:6},
  {p:445,n:"SMB",t:6},{p:3389,n:"RDP",t:6},{p:53,n:"DNS",t:17},{p:123,n:"NTP",t:17},{p:161,n:"SNMP",t:17}
];
const h2=b=>b.toString(16).toUpperCase().padStart(2,"0");
const w16=n=>[(n>>>8)&255,n&255];
const ipB=ip=>ip.split(".").map(Number);
/* somme de contrôle Internet : complément à un de la somme des mots de 16 bits */
function cksum(bytes){
  let s=0;
  for(let i=0;i<bytes.length;i+=2) s+=(bytes[i]<<8)|(bytes[i+1]||0);
  while(s>>>16) s=(s&0xFFFF)+(s>>>16);
  return (~s)&0xFFFF;
}
function randIp(){
  const k=R(4);
  if(k===0) return `192.168.${R(256)}.${1+R(254)}`;
  if(k===1) return `10.${R(256)}.${R(256)}.${1+R(254)}`;
  if(k===2) return `172.${16+R(16)}.${R(256)}.${1+R(254)}`;
  let a; do{a=1+R(223);}while([10,127,169,172,192].includes(a));
  return `${a}.${R(256)}.${R(256)}.${1+R(254)}`;
}
function ipv4Header(o){
  const b=[0x45,0,...w16(o.len),...w16(o.id),o.df?0x40:0,0,o.ttl,o.proto,0,0,...ipB(o.src),...ipB(o.dst)];
  const c=cksum(b); b[10]=c>>>8; b[11]=c&255;
  return b;
}
const hexLine=a=>a.map(h2).join(" ");
const byteDec=x=>`${h2(x)} = ${parseInt(h2(x)[0],16)}×16 + ${parseInt(h2(x)[1],16)} = <b>${x}</b>`;
const ipDecode=a=>a.map(x=>`  ${byteDec(x)}`).join("\n");

function makeIpv4(){
  const proto=[1,6,17][R(3)];
  const initTtl=[64,128,255][R(3)], ttl=initTtl-R(25);
  const len=20+(proto===1?8+R(56):proto===6?20+R(200):8+R(120));
  const src=randIp(), dst=randIp();
  const b=ipv4Header({len,id:R(65536),df:R(2),ttl,proto,src,dst});
  const rows=[0,4,8,12,16].map(o=>`+${String(o).padStart(2,"0")}&nbsp;&nbsp;${hexLine(b.slice(o,o+4))}`).join("<br>");
  return {
    prompt:"Voici un en-tête IPv4 capturé, quatre octets par ligne, décalage à gauche. Extrais les quatre champs demandés.",
    given:rows,
    fields:[{k:"t",label:"TTL (décimal)",ph:"0-255"},{k:"p",label:"Protocole",ph:"nom ou numéro"},
            {k:"s",label:"IP source",ph:"x.x.x.x"},{k:"d",label:"IP destination",ph:"x.x.x.x"}],
    answers:{t:String(ttl),p:PROTOS[proto],s:src,d:dst},
    norm:(v,k)=>{
      let s=String(v).replace(/\s+/g,"").toUpperCase();
      if(k==="p"){
        if(/^0X[0-9A-F]+$/.test(s)) s=String(parseInt(s.slice(2),16));
        if(/^\d+$/.test(s)) s=PROTOS[+s]||s;
      }
      return s;
    },
    explain(){
      const guess=initTtl===255?"255 : typiquement un équipement réseau":initTtl===128?"128 : typiquement Windows":"64 : typiquement Linux, macOS ou Android";
      return `<pre>Octet 0       <b>${h2(b[0])}</b>   <span class="c">nibble haut 4 = IPv4, nibble bas 5 = 5 mots de 4 octets = 20 octets d'en-tête</span>
Octets 2-3    ${h2(b[2])} ${h2(b[3])}   <span class="c">longueur totale = ${b[2]}×256 + ${b[3]} = ${len} octets</span>
Octet 8       <b>${h2(b[8])}</b>   TTL : ${byteDec(b[8])}
Octet 9       <b>${h2(b[9])}</b>   protocole : ${proto} → <b>${PROTOS[proto]}</b>   <span class="c">1 = ICMP, 6 = TCP, 17 = UDP</span>

Octets 12-15  source, un octet à la fois :
${ipDecode(b.slice(12,16))}
  → <b>${src}</b>

Octets 16-19  destination :
${ipDecode(b.slice(16,20))}
  → <b>${dst}</b></pre>
      <p>Le TTL lu vaut ${ttl}. La valeur de départ probable est la plus petite valeur, parmi 64, 128 et 255, qui soit supérieure ou égale à ${ttl}, soit ${guess}, ${initTtl===ttl?"et le paquet n'a traversé aucun routeur":`et le paquet a traversé ${initTtl-ttl} routeur${initTtl-ttl>1?"s":""}`}. L'erreur classique est de compter les octets à partir de 1 : le TTL est à l'octet 8 en comptant depuis 0, c'est-à-dire le premier octet de la troisième ligne.</p>`;
    }
  };
}

function makePaquet(){
  const sv=SERVICES[R(SERVICES.length)];
  const sport=49152+R(16384), src=randIp(), dst=randIp();
  const randB=n=>Array.from({length:n},()=>R(256));
  const mac=()=>{const m=randB(6); m[0]&=0xFC; return m;};
  let l4;
  if(sv.t===6){
    l4=[...w16(sport),...w16(sv.p),...randB(4),0,0,0,0,0x50,0x02,0xFA,0xF0,0,0,0,0];
  }else{
    const pl=randB(4+R(12));
    l4=[...w16(sport),...w16(sv.p),...w16(8+pl.length),0,0,...pl];
  }
  const ip=ipv4Header({len:20+l4.length,id:R(65536),df:1,ttl:[64,128][R(2)],proto:sv.t,src,dst});
  const pseudo=[...ipB(src),...ipB(dst),0,sv.t,...w16(l4.length)];
  const c=cksum([...pseudo,...l4]);
  const ck=sv.t===6?16:6, cv=(sv.t===17&&c===0)?0xFFFF:c; l4[ck]=cv>>>8; l4[ck+1]=cv&255;
  const all=[...mac(),...mac(),0x08,0x00,...ip,...l4];
  const lines=[];
  for(let o=0;o<all.length;o+=16){
    const a=all.slice(o,o+16);
    lines.push(o.toString(16).padStart(4,"0")+"&nbsp;&nbsp;"+hexLine(a.slice(0,8))+(a.length>8?"&nbsp;&nbsp;"+hexLine(a.slice(8)):""));
  }
  const name=PROTOS[sv.t];
  return {
    prompt:"Voici une trame Ethernet capturée en entier, seize octets par ligne, décalage en hexadécimal à gauche. Un poste ouvre une communication vers un serveur. Identifie le transport, les deux ports et le service visé.",
    given:lines.join("<br>"),
    fields:[{k:"t",label:"Transport",ph:"TCP ou UDP"},{k:"s",label:"Port source",ph:"0-65535"},
            {k:"d",label:"Port destination",ph:"0-65535"},{k:"n",label:"Service",ph:"ex. SSH"}],
    answers:{t:name,s:String(sport),d:String(sv.p),n:sv.n},
    norm:(v,k)=>{
      let s=String(v).replace(/\s+/g,"").toUpperCase();
      if(k==="t"&&/^\d+$/.test(s)) s=PROTOS[+s]||s;
      return s;
    },
    explain(){
      const p=all.slice(34,38);
      return `<pre>0x00-0x05   ${hexLine(all.slice(0,6))}   <span class="c">MAC destination</span>
0x06-0x0B   ${hexLine(all.slice(6,12))}   <span class="c">MAC source</span>
0x0C-0x0D   <b>08 00</b>                <span class="c">EtherType : IPv4 suit</span>

0x0E        <b>45</b>   <span class="c">début de l'en-tête IP, IHL 5 → 20 octets</span>
0x17        <b>${h2(sv.t)}</b>   <span class="c">octet 9 de l'en-tête IP (14 + 9 = 23 = 0x17) : protocole ${sv.t} → ${name}</span>

Le transport commence à 14 + 20 = 34 = <b>0x22</b>, troisième octet de la troisième ligne.
0x22-0x23   ${h2(p[0])} ${h2(p[1])}   port source      = ${p[0]}×256 + ${p[1]} = <b>${sport}</b>
0x24-0x25   ${h2(p[2])} ${h2(p[3])}   port destination = ${p[2]}×256 + ${p[3]} = <b>${sv.p}</b> → <b>${sv.n}</b></pre>
      <p>Le port source, au-dessus de 49152, est un port éphémère choisi au hasard par le système du client : il ne désigne aucun service. C'est le port destination, bas et connu, qui dit à quoi le poste veut parler. L'erreur fréquente est de chercher les ports juste après l'EtherType : il faut d'abord sauter les 20 octets de l'en-tête IP, dont la longueur se lit dans le nibble bas de l'octet 0x0E.</p>`;
    }
  };
}

const GENERATORS={convBin:makeConvBin,convTriple:makeConvTriple,bitop:makeBitop,subnet:makeSubnet,ipv4:makeIpv4,paquet:makePaquet};

/* ============================================================
   RENDU
   ============================================================ */
const view=document.getElementById("view");

function blockHtml(b){
  switch(b.t){
    case "p":    return `<p>${b.v}</p>`;
    case "h3":   return `<h3>${b.v}</h3>`;
    case "pre":  return `<pre>${esc(b.v)}</pre>`;
    case "note": return `<p class="note">${b.v}</p>`;
    case "table":{
      const head=b.head.map(h=>`<th>${h}</th>`).join("");
      const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("");
      return `<div class="tscroll"><table><tr>${head}</tr>${rows}</table></div>`;
    }
    default: return "";
  }
}

/* --- exercice interactif --- */
let exSeq=0;
function exerciseHtml(spec,mod){
  const id="ex"+(++exSeq);
  if(spec.gen==="qcm") return `<div class="ex" id="${id}" data-qcm="1"></div>`;
  return `<div class="ex" id="${id}" data-gen="${spec.gen}"></div>`;
}
function mountExercise(el,mod){
  if(el.dataset.qcm){ return mountQcm(el,mod); }
  const g=GENERATORS[el.dataset.gen];
  if(!g){ el.innerHTML=`<div class="err">Générateur inconnu : <code>${el.dataset.gen}</code>. Ajoute-le dans app/index.html.</div>`; return; }
  function round(){
    const x=g();
    el.innerHTML=`<p class="tag-ex">Exercice</p><p style="font-size:15px;margin:0 0 10px">${x.prompt}</p>
      <p class="given">${x.given}</p>
      <div class="conv">${x.fields.map(f=>`<div class="cell"><span>${f.label}</span><input data-k="${f.k}" autocomplete="off" placeholder="${f.ph}"></div>`).join("")}</div>
      <div class="row"><button class="act" data-a="check">Vérifier</button><button class="act ghost" data-a="new">Autre énoncé</button></div>
      <div class="slot"></div>`;
    el.querySelector('[data-a="new"]').onclick=round;
    el.querySelector('[data-a="check"]').onclick=()=>{
      let all=true;
      el.querySelectorAll("input[data-k]").forEach(i=>{
        const k=i.dataset.k;
        const ok=(x.norm?x.norm(i.value,k):String(i.value).trim())===x.answers[k];
        i.classList.toggle("good",ok);i.classList.toggle("bad",!ok);
        if(!ok)all=false;
      });
      el.querySelector(".slot").innerHTML=
        `<div class="corr" data-ok="${all?1:0}"><h4>${all?"Juste":"Faux — voici le raisonnement"}</h4>${x.explain(all)}</div>`;
    };
  }
  round();
}
/* Mélange les options d'une question à chaque affichage.
   Sans ça, la bonne réponse reste toujours à la même place et se devine sans rien savoir. */
function shuffleQ(src){
  const idx=src.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return {q:src.q, w:src.w, o:idx.map(i=>src.o[i]), a:idx.indexOf(src.a)};
}

function mountQcm(el,mod){
  if(!mod.qcm||!mod.qcm.length){el.innerHTML=`<div class="err">Ce module n'a pas de QCM.</div>`;return;}
  let pool=[];
  function round(){
    if(!pool.length) pool=mod.qcm.map((_,i)=>i).sort(()=>Math.random()-.5);
    const q=shuffleQ(mod.qcm[pool.pop()]);
    el.innerHTML=`<p class="tag-ex">Exercice · raisonnement</p><p style="font-size:15px;margin:0 0 12px">${q.q}</p>
      <div class="opts"></div><div class="slot"></div>
      <div class="row"><button class="act ghost" data-a="new" hidden>Question suivante</button></div>`;
    const box=el.querySelector(".opts"), next=el.querySelector('[data-a="new"]');
    next.onclick=round;
    q.o.forEach((t,i)=>{
      const b=document.createElement("button");
      b.className="opt";b.type="button";
      b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span>${t}</span>`;
      b.onclick=()=>{
        [...box.children].forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("good");else if(j===i)x.classList.add("bad");});
        el.querySelector(".slot").innerHTML=`<div class="corr" data-ok="${i===q.a?1:0}"><h4>${i===q.a?"Juste":"Faux — voici le raisonnement"}</h4><p>${q.w}</p></div>`;
        next.hidden=false;
      };
      box.appendChild(b);
    });
  }
  round();
}

/* --- page module --- */
function renderModule(mod){
  exSeq=0;
  const secs=mod.sections.map((s,i)=>`
    <h2><span class="n">SECTION ${i+1}</span>${s.title}</h2>
    ${s.blocks.map(blockHtml).join("")}
    ${s.exercise?exerciseHtml(s.exercise,mod):""}`).join("");
  const pass=(mod.eval&&mod.eval.pass)||4, count=(mod.eval&&mod.eval.count)||5;
  view.innerHTML=`
    <p style="font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px">
      NIVEAU ${mod.level} · MODULE <b style="color:var(--accent)">${mod.id}</b> · ${mod.duration||""}</p>
    <h1>${mod.title}</h1>
    <p class="sub">${mod.subtitle||""}</p>
    <div class="why"><p><strong>Pourquoi ce module existe.</strong> ${mod.why}</p></div>
    ${secs}
    <div class="eval">
      <p class="tag-ex">Évaluation du module</p>
      <p style="margin:0 0 4px">${count} questions, sans retour en arrière. Il faut <strong>${pass} sur ${count}</strong> pour valider ${mod.id}.</p>
      <div class="row"><button class="act" id="go-eval">Lancer l'évaluation</button></div>
      <div id="eval-body"></div>
    </div>
    <div class="row"><button class="act ghost" id="back">Retour au sommaire</button></div>`;
  view.querySelectorAll(".ex").forEach(el=>mountExercise(el,mod));
  document.getElementById("back").onclick=renderIndex;
  document.getElementById("go-eval").onclick=()=>runEval(mod);
  window.scrollTo(0,0);
}

function runEval(mod){
  const count=(mod.eval&&mod.eval.count)||5, pass=(mod.eval&&mod.eval.pass)||4;
  const gens=[...new Set(mod.sections.filter(s=>s.exercise&&s.exercise.gen!=="qcm").map(s=>s.exercise.gen))];
  const items=[];
  const nGen=Math.min(gens.length, Math.max(0,count-2));
  for(let i=0;i<nGen;i++) items.push({type:"gen",g:gens[i%gens.length]});
  const picks=mod.qcm.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,count-items.length);
  picks.forEach(i=>items.push({type:"qcm",q:shuffleQ(mod.qcm[i])}));
  items.sort(()=>Math.random()-.5);

  const body=document.getElementById("eval-body");
  document.getElementById("go-eval").hidden=true;
  let i=0,good=0;
  function step(){
    if(i>=items.length){
      const ok=good>=pass;
      if(ok){prog[mod.id]=true;save();paintGlobal();}
      body.innerHTML=`<div class="pbar"><i style="width:100%"></i></div>
        <div class="big">${good} / ${items.length}</div>
        <p class="gate">${ok?"Module validé.":"Pas encore. Reprends les sections où tu as buté, puis relance."}</p>
        <div class="row" style="justify-content:center">
          <button class="act ghost" id="re">Relancer</button>
          <button class="act" id="idx">Sommaire</button></div>`;
      document.getElementById("re").onclick=()=>{document.getElementById("go-eval").hidden=false;body.innerHTML="";};
      document.getElementById("idx").onclick=renderIndex;
      return;
    }
    const it=items[i];
    const head=`<div class="pbar"><i style="width:${i/items.length*100}%"></i></div>
      <p class="tag-ex" style="color:var(--muted)">Question ${i+1} / ${items.length}</p>`;
    if(it.type==="gen"){
      const x=GENERATORS[it.g]();
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 10px">${x.prompt}</p><p class="given">${x.given}</p>
        <div class="conv">${x.fields.map(f=>`<div class="cell"><span>${f.label}</span><input data-k="${f.k}" autocomplete="off" placeholder="${f.ph}"></div>`).join("")}</div>
        <div class="row"><button class="act" id="go">Valider</button></div>`;
      document.getElementById("go").onclick=()=>{
        let all=true;
        body.querySelectorAll("input[data-k]").forEach(inp=>{
          const k=inp.dataset.k;
          if((x.norm?x.norm(inp.value,k):String(inp.value).trim())!==x.answers[k]) all=false;
        });
        if(all)good++; i++; step();
      };
    }else{
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 12px">${it.q.q}</p><div class="opts"></div>`;
      const box=body.querySelector(".opts");
      it.q.o.forEach((t,j)=>{
        const b=document.createElement("button");
        b.className="opt";b.type="button";
        b.innerHTML=`<span class="k">${"ABCD"[j]}</span><span>${t}</span>`;
        b.onclick=()=>{if(j===it.q.a)good++;i++;step();};
        box.appendChild(b);
      });
    }
  }
  step();
}

/* --- sommaire --- */
function renderIndex(){
  const lv=CUR.niveaux.map(L=>{
    const tot=L.modules.length;
    const done=L.modules.filter(m=>prog[m.id]).length;
    const rows=L.modules.map(m=>{
      const exists=INDEX.includes(m.id);
      return `<button class="mrow ${prog[m.id]?"ok":""} ${exists?"":"missing"}" data-id="${m.id}" ${exists?"":"disabled"}>
        <span class="dot"></span>
        <span class="mt"><b>${m.titre}</b><em>${m.resume}</em></span>
        <span class="tag">${exists?m.id:"à écrire"}</span></button>`;
    }).join("");
    return `<section class="lvl">
      <button class="lhead"><span class="num">N${L.n}</span>
        <span class="tx"><strong>${L.titre}</strong><em>${L.but}</em></span>
        <span class="pc">${done}/${tot}</span></button>
      <div class="lbody">${rows}</div></section>`;
  }).join("");
  view.innerHTML=`<h1>${CUR.titre}</h1>
    <p class="sub">${CUR.niveaux.length} niveaux, ${INDEX.length} modules écrits sur ${CUR.niveaux.reduce((a,l)=>a+l.modules.length,0)}. Un module se valide par son évaluation, pas par sa lecture.</p>
    ${lv}`;
  view.querySelectorAll(".lhead").forEach(h=>{
    const body=h.nextElementSibling;
    h.onclick=()=>{body.hidden=!body.hidden;};
  });
  view.querySelectorAll(".mrow:not(.missing)").forEach(b=>{
    b.onclick=()=>openModule(b.dataset.id);
  });
  window.scrollTo(0,0);
}

async function openModule(id){
  view.innerHTML=`<p class="sub">Chargement…</p>`;
  try{
    const r=await fetch(`../modules/${id}.json`);
    if(!r.ok) throw new Error(r.status);
    renderModule(await r.json());
  }catch(e){
    view.innerHTML=`<div class="err">Impossible de charger <code>modules/${id}.json</code>.
      Lance un serveur local depuis la racine du projet : <code>python3 -m http.server</code>, puis ouvre <code>http://localhost:8000/app/</code>.</div>
      <div class="row"><button class="act ghost" id="back">Retour</button></div>`;
    document.getElementById("back").onclick=renderIndex;
  }
}

function paintGlobal(){
  const tot=CUR?CUR.niveaux.reduce((a,l)=>a+l.modules.length,0):0;
  const done=Object.keys(prog).filter(k=>prog[k]).length;
  document.getElementById("g-done").textContent=done;
  document.getElementById("g-tot").textContent=tot;
  document.getElementById("g-bar").style.width=tot?Math.round(done/tot*100)+"%":"0%";
}

document.getElementById("home").onclick=()=>{if(CUR)renderIndex();};

(async function boot(){
  try{
    CUR=await (await fetch("../curriculum.json")).json();
  }catch(e){
    view.innerHTML=`<div class="err"><p><strong>curriculum.json introuvable.</strong></p>
      <p>Cette page doit être servie par un serveur HTTP, pas ouverte en double-clic. Depuis la racine du projet :</p>
      <pre>python3 -m http.server</pre><p>puis ouvre <code>http://localhost:8000/app/</code></p></div>`;
    return;
  }
  const all=CUR.niveaux.flatMap(l=>l.modules.map(m=>m.id));
  const checks=await Promise.all(all.map(id=>fetch(`../modules/${id}.json`,{method:"HEAD"}).then(r=>r.ok).catch(()=>false)));
  INDEX=all.filter((id,i)=>checks[i]);
  paintGlobal();
  renderIndex();
})();
</script>
