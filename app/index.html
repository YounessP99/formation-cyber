/* ============================================================
   SAUVEGARDE DE LA PROGRESSION (§9.2) — logique dans progression.js
   Solution d'attente avant la synchronisation : un fichier à télécharger et à recharger.
   ============================================================ */
const KEY_SAUVE="fc.sauvegarde";   /* réglage de l'appareil, jamais exporté */
const lireMeta=()=>{try{return JSON.parse(localStorage.getItem(KEY_SAUVE))||{};}catch(e){return {};}};
const ecrireMeta=m=>{try{localStorage.setItem(KEY_SAUVE,JSON.stringify(m));}catch(e){}};
const joursDepuis=iso=>Math.floor((Date.now()-new Date(iso).getTime())/864e5);
function instantaneLocal(){try{return Progression.instantane(localStorage);}catch(e){return {};}}
/* rappel discret dans l'en-tête : progression jamais sauvegardée, ou sauvegardée il y a plus de 7 jours */
function majRappel(){
  const b=document.getElementById("b-sauve"), d=lireMeta().derniere;
  const aSauver=!Progression.resume(instantaneLocal()).vide;
  const j=d?joursDepuis(d):null, du=aSauver&&(j===null||j>7)&&!(SYNC.actif()&&SYNC.infos().etat==="ok");
  b.classList.toggle("due",du);
  b.textContent=du?(j===null?"À sauvegarder":`Sauvegarde : ${j} j`):"Sauvegarde";
  b.title=d?`Dernière sauvegarde le ${new Date(d).toLocaleDateString("fr-FR")}`:"Jamais sauvegardé sur cet appareil";
}
function ligneEtat(nom,a,b){return `<tr><td>${nom}</td><td>${a}</td>${b===undefined?"":`<td>${b}</td>`}</tr>`;}
function tableEtat(r,r2){
  const deux=r2!==undefined;
  return `<div class="tscroll"><table class="etat"><tr><th></th><th>${deux?"Fichier":"Ici"}</th>${deux?"<th>Ici</th>":""}</tr>
    ${ligneEtat("Modules validés",r.modules,deux?r2.modules:undefined)}
    ${ligneEtat("Examens de niveau validés",r.examens,deux?r2.examens:undefined)}
    ${ligneEtat("Modules commencés (étapes)",r.etapes,deux?r2.etapes:undefined)}
    ${ligneEtat("Cartes du parcours suivies",r.cartes,deux?r2.cartes:undefined)}
    ${ligneEtat("Cartes ESGI suivies",r.cartesEsgi,deux?r2.cartesEsgi:undefined)}
    ${ligneEtat("Étapes de TP cochées",r.etapesTp,deux?r2.etapesTp:undefined)}
  </table></div>`;
}
const dateHeure=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
function telecharger(){
  const maintenant=new Date(), f=Progression.fichier(instantaneLocal(),maintenant);
  const p=n=>String(n).padStart(2,"0");
  const nom=`progression-${maintenant.getFullYear()}-${p(maintenant.getMonth()+1)}-${p(maintenant.getDate())}.json`;
  const url=URL.createObjectURL(new Blob([JSON.stringify(f,null,1)],{type:"application/json"}));
  const a=document.createElement("a"); a.href=url; a.download=nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  ecrireMeta({...lireMeta(),derniere:maintenant.toISOString()});
  return nom;
}
function renderSauvegarde(message){
  marquerOnglet(null);
  const r=Progression.resume(instantaneLocal()), d=lireMeta().derniere;
  let restaure=null; try{restaure=sessionStorage.getItem("fc.restaure");sessionStorage.removeItem("fc.restaure");}catch(e){}
  view.innerHTML=`<h1>Sauvegarde de la progression</h1>
    <p class="sub">Ta progression vit seulement dans ce navigateur, à cette adresse (<code>${echap(location.host||"fichier local")}</code>) : une autre adresse, comme la version publiée en ligne, ne la voit pas. Ce fichier sert à la mettre à l'abri et à la transporter d'un appareil à l'autre.</p>
    ${restaure||message?`<div class="ok-msg">${restaure||message}</div>`:""}
    ${sectionSync()}
    <section class="cadre-sauve">
      <h2>Sauvegarder</h2>
      ${tableEtat(r)}
      <p class="note" style="margin-top:0">${d?`Dernière sauvegarde le ${dateHeure(new Date(d))}${joursDepuis(d)>7?", il y a plus de 7 jours":""}.`:"Jamais sauvegardé sur cet appareil."}</p>
      <div class="row"><button class="act" id="sauver" ${r.vide?"disabled":""}>Sauvegarder ma progression</button></div>
    </section>
    <section class="cadre-sauve">
      <h2>Restaurer</h2>
      <p>Choisis un fichier <code>progression-AAAA-MM-JJ.json</code>. Rien n'est modifié avant ta confirmation.</p>
      <input type="file" id="fichier" accept=".json,application/json" hidden><div class="row"><button class="act ghost" id="choisir" type="button">Choisir un fichier</button></div>
      <div id="apercu"></div>
    </section>`;
  if(!r.vide) document.getElementById("sauver").onclick=()=>{const n=telecharger();majRappel();renderSauvegarde(`Fichier <code>${n}</code> téléchargé. Range-le hors de ce navigateur (OneDrive, clé USB).`);};
  brancherSync();
  document.getElementById("choisir").onclick=()=>document.getElementById("fichier").click();
  document.getElementById("fichier").onchange=e=>{const f=e.target.files[0]; if(f) lireFichier(f);};
  window.scrollTo(0,0);
}
function lireFichier(f){
  const zone=document.getElementById("apercu");
  const echec=m=>{zone.innerHTML=`<div class="err" style="margin-top:12px">${m}</div>`;};
  if(f.size>5e6) return echec("Fichier trop gros pour être une sauvegarde de progression.");
  const lecteur=new FileReader();
  lecteur.onerror=()=>echec("Lecture du fichier impossible.");
  lecteur.onload=()=>{
    let v; try{v=Progression.verifier(JSON.parse(lecteur.result));}catch(e){return echec(e instanceof SyntaxError?"Ce fichier n'est pas du JSON valide.":echap(e.message));}
    const rf=Progression.resume(v.cles), rl=Progression.resume(instantaneLocal());
    if(rf.vide) return echec("Cette sauvegarde ne contient aucune progression.");
    zone.innerHTML=`<h3>${echap(f.name)}</h3>
      <p>Sauvegarde du ${v.date?dateHeure(v.date):"(date illisible)"}.</p>
      ${tableEtat(rf,rl)}
      ${v.ignorees.length?`<p class="note">${v.ignorees.length} élément${v.ignorees.length>1?"s":""} inconnu${v.ignorees.length>1?"s":""} ou abîmé${v.ignorees.length>1?"s":""}, laissé${v.ignorees.length>1?"s":""} de côté.</p>`:""}
      <div class="choix-mode" role="radiogroup" aria-label="Mode de restauration">
        <label><input type="radio" name="mode" value="fusionner" checked><span><strong>Fusionner</strong> (conseillé) : un module ou un examen validé d'un côté reste validé ; une carte garde la boîte la plus basse des deux ; un module commencé garde l'étape la plus avancée.</span></label>
        <label><input type="radio" name="mode" value="remplacer"><span><strong>Remplacer</strong> : la progression de ce navigateur est effacée et remplacée par celle du fichier.</span></label>
      </div>
      <div class="row"><button class="act" id="confirmer">Confirmer la restauration</button><button class="act ghost" id="annuler">Annuler</button></div>`;
    document.getElementById("annuler").onclick=()=>{zone.innerHTML="";document.getElementById("fichier").value="";};
    document.getElementById("confirmer").onclick=()=>{
      const mode=zone.querySelector("input[name=mode]:checked").value;
      try{Progression.appliquer(localStorage,v.cles,mode);}catch(e){return echec("Écriture impossible dans ce navigateur (stockage plein ou bloqué).");}
      try{sessionStorage.setItem("fc.restaure",`Progression ${mode==="remplacer"?"remplacée":"fusionnée"} depuis <code>${echap(f.name)}</code>.`);}catch(e){}
      location.hash="#sauvegarde"; location.reload();   /* recharge : toutes les vues relisent la progression */
    };
  };
  lecteur.readAsText(f);
}

/* ============================================================
   SYNCHRONISATION (§9.4) — logique dans sync.js
   ============================================================ */
const LIBELLES_SYNC={ok:"Synchronisé",attente:"En attente",erreur:"Erreur de synchro"};
function peindreSync(){
  const el=document.getElementById("etat-sync"), i=SYNC.infos();
  el.hidden=!SYNC.actif();
  el.dataset.etat=i.etat; el.textContent=LIBELLES_SYNC[i.etat]||"";
  el.title=i.detail||(i.derniere?"Dernière synchronisation : "+new Date(i.derniere).toLocaleString("fr-FR"):"");
  majRappel();
  if(location.hash==="#sauvegarde"&&document.getElementById("etat-sync-page")) document.getElementById("etat-sync-page").innerHTML=texteEtatSync();
}
/* une synchro a apporté du nouveau : on recharge les progressions en mémoire SANS remplacer les objets,
   pour qu'une révision ou une évaluation en cours continue d'écrire au bon endroit */
function remplacerEnPlace(obj,cle){let n={};try{n=JSON.parse(localStorage.getItem(cle))||{};}catch(e){}Object.keys(obj).forEach(k=>delete obj[k]);Object.assign(obj,n);}
function relireProgression(){
  remplacerEnPlace(prog,KEY); remplacerEnPlace(boites,KEYC); remplacerEnPlace(boitesEsgi,KEY_ESGI);
  if(typeof avance==="object"&&avance) remplacerEnPlace(avance,"formation.cyber.etapes.v1");
  remplacerEnPlace(tpCoches,KEY_TP);
  paintGlobal(); majRappel();
}
const SYNC=Sync.creer({stockage:localStorage,fetch:(u,i)=>fetch(u,i),horsLigne:()=>navigator.onLine===false,
  surEtat:()=>peindreSync(),surChangement:()=>relireProgression()});
setInterval(()=>{try{SYNC.surveiller();}catch(e){}},2000);
peindreSync();
window.addEventListener("online",()=>SYNC.synchroniser());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")SYNC.synchroniser();else SYNC.depart();});
window.addEventListener("pagehide",()=>SYNC.depart());
function texteEtatSync(){

}

    </ol>
    <div class="champ-jeton" id="form-jeton">
      <input type="password" id="jeton" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Jeton GitHub, portée gist uniquement">
      <button class="act" type="button" id="activer-sync">Activer</button>
    </div>
    <div id="sync-msg"></div>
  </section>`;
}
function brancherSync(){
  /* pas de <form> : même si le script échouait, le jeton ne pourrait pas partir dans une adresse */
  const f=document.getElementById("form-jeton");
  if(f){document.getElementById("jeton").onkeydown=e=>{if(e.key==="Enter")document.getElementById("activer-sync").click();};}
  if(f) document.getElementById("activer-sync").onclick=async()=>{
    const champ=document.getElementById("jeton"), msg=document.getElementById("sync-msg"), b=document.getElementById("activer-sync");
    if(!champ.value.trim()){msg.innerHTML=`<div class="err" style="margin-top:12px">Colle d'abord le jeton.</div>`;return;}
    b.disabled=true; msg.innerHTML=`<p class="note">Connexion à GitHub…</p>`;
    try{await SYNC.activer(champ.value); champ.value=""; relireProgression(); renderSauvegarde("Synchronisation activée.");}
    catch(x){champ.value=""; b.disabled=false; msg.innerHTML=`<div class="err" style="margin-top:12px">Activation impossible : ${echap(x.message)}.</div>`;}
    peindreSync();
  };
  const m=document.getElementById("sync-maintenant");
  if(m) m.onclick=async()=>{m.disabled=true;await SYNC.synchroniser();renderSauvegarde();};
  const off=document.getElementById("sync-off");
  if(off) off.onclick=()=>{SYNC.desactiver();renderSauvegarde("Synchronisation désactivée sur cet appareil : le jeton est effacé. Le Gist reste sur ton compte GitHub.");};
}

function router(){
  if(!CUR) return;
  majRappel();
  const h=location.hash;
  let x;
  if(h==="#sauvegarde") return renderSauvegarde();
  if((x=h.match(/^#m=([\w-]+)$/))) return openModule(x[1]);
  if((x=h.match(/^#cours=([a-z0-9-]+)$/))) return SECTIONS.cours(x[1]);
  if((x=h.match(/^#realisations=([a-z0-9-]+)$/))) return SECTIONS.realisations(x[1]);
  if((x=h.match(/^#(realisations|cours|tp|controles)$/))) return SECTIONS[x[1]]();
  renderIndex();
}
window.addEventListener("hashchange",router);
/* un clic sur l'onglet déjà ouvert le recharge (retour au sommaire depuis une révision, par exemple) */
document.getElementById("onglets").addEventListener("click",e=>{
  const a=e.target.closest("a[href^='#']"); if(!a) return;
  if(a.getAttribute("href")===location.hash||(a.dataset.onglet==="parcours"&&!location.hash)){e.preventDefault();router();}
});
</script>
