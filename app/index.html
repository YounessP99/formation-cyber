<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formation Cybersécurité</title>
<script>
/* le thème est posé avant le premier affichage */
(function(){
  var t=null; try{t=localStorage.getItem("fc.theme");}catch(e){}
  if(t!=="dark"&&t!=="light"){t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}
  document.documentElement.setAttribute("data-theme",t);
})();
</script>
<style>
@font-face{font-family:"Anybody";src:url("../design/fonts/anybody-latin-standard-normal.woff2") format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:swap}
@font-face{font-family:"Atkinson Next";src:url("../design/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Atkinson Mono";src:url("../design/fonts/atkinson-hyperlegible-mono-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root,[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2B1530; --vernis:#241029; --panel:#3A2140; --panel-2:#452A4B; --line:#5B3F61;
  --fg:#F7EEF4; --fg-2:#D6C3D6; --muted:#B39DB6; --accent:#FFD23F; --cuivre:#E39A5B;
  --action:#FFD23F; --sur-vif:#22102B; --bord-vif:transparent; --ok:#56E68A; --bad:#FF7A66; --halo:1;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#FBF8FC; --vernis:#F3EDF5; --panel:#FFFFFF; --panel-2:#F3EDF5; --line:#CDBFD1;
  --fg:#22102B; --fg-2:#4F3B57; --muted:#68546F; --accent:#8F4A12; --cuivre:#A84E18;
  --action:#FFC933; --sur-vif:#22102B; --bord-vif:#22102B; --ok:#0E7A41; --bad:#C42A18; --halo:0;
}
:root{
  --mono:"Atkinson Mono",ui-monospace,Consolas,monospace;
  --sans:"Atkinson Next","Segoe UI",system-ui,sans-serif;
  --display:"Anybody","Arial Black",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.62;padding-inline:16px;padding-block:0 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto}
img{max-width:100%}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-block:11px;margin-bottom:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.02em;cursor:pointer;background:none;border:0;color:var(--fg);padding:0;margin-right:auto}
.brand span{color:var(--accent)}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mini b{color:var(--fg);font-variant-numeric:tabular-nums}
.gbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex:1 0 100%;margin-top:2px}
.gbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}

h1{font-family:var(--display);font-weight:700;font-size:clamp(25px,6vw,34px);line-height:1.15;margin:2px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:36px 0 10px;text-wrap:balance}
h2 .n{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;letter-spacing:.09em;margin-bottom:3px;font-weight:400}
h3{font-family:var(--display);font-weight:600;font-size:15.5px;margin:22px 0 7px}
p{margin:0 0 13px}
strong{font-weight:700;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--vernis);padding:1.5px 5px;border-radius:3px;color:var(--fg);overflow-wrap:anywhere}
.sub{font-size:15px;color:var(--muted);margin:0 0 22px;max-width:58ch}
.why{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:3px;padding:14px 15px;margin:0 0 26px;font-size:14.5px}
.note{border-left:2px solid var(--line);padding-left:13px;color:var(--muted);font-size:14px;margin:18px 0}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.75;background:var(--vernis);border:1px solid var(--line);border-radius:3px;padding:13px;overflow-x:auto;margin:0 0 16px;color:var(--fg);white-space:pre}
pre b{color:var(--accent);font-weight:500}
pre .c{color:var(--muted)}
.tscroll{overflow-x:auto;margin-bottom:16px}
table{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;width:100%}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;font-variant-numeric:tabular-nums}
th{background:var(--panel-2);color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}

/* sommaire */
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:11px;overflow:hidden}
.lvl.cur{border-color:var(--accent)}
.lhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:14px;cursor:pointer}
.num{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:4px 7px;flex:none}
.lhead .tx{flex:1;min-width:0}
.lhead strong{display:block;font-family:var(--display);font-size:15px}
.lhead em{font-style:normal;font-size:12.5px;color:var(--muted)}
.lhead .pc{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.lbody{border-top:1px solid var(--line);padding:6px 0}
.mrow{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:10px 14px;cursor:pointer;min-width:0}
.mrow:hover{background:var(--panel-2)}
.mrow .dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted);flex:none}
.mrow.ok .dot{background:var(--ok);border-color:var(--ok)}
.mrow.missing{opacity:.45;cursor:default}
.mrow .mt{min-width:0;flex:1}
.mrow .mt b{display:block;font-weight:500;font-size:14.5px}
.mrow .mt em{font-style:normal;font-size:12.5px;color:var(--muted)}
.mrow .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;flex:none}

/* exercices */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 15px;margin:22px 0}
.tag-ex{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 9px}
.given{font-family:var(--mono);font-size:19px;color:var(--accent);padding:6px 0;word-break:break-all}
.conv{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 150px}
.cell span{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cell input{font-family:var(--mono);font-size:16px;min-height:44px;background:var(--vernis);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:9px 10px;width:100%}
.cell input.good{border-color:var(--ok)} .cell input.bad{border-color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;padding-top:1px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)} .opt.good .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)} .opt.bad .k{color:var(--bad)}
.corr{margin-top:13px;padding:13px 14px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line);font-size:14px}
.corr[data-ok="1"]{border-left:2px solid var(--ok)}
.corr[data-ok="0"]{border-left:2px solid var(--bad)}
.corr h4{font-family:var(--display);font-size:13px;margin:0 0 7px}
.corr p:last-child{margin-bottom:0}

button.act{font-family:var(--sans);font-size:1rem;font-weight:700;background:var(--action);color:var(--sur-vif);border:1.5px solid var(--bord-vif);border-radius:6px;padding:9px 17px;min-height:44px;cursor:pointer}
button.act.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--muted)}
button.act:hover{filter:brightness(1.08)}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.eval{border:1px solid var(--accent);border-radius:4px;padding:18px 16px;margin:40px 0 0;background:var(--panel)}
.big{font-family:var(--display);font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.gate{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 0}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 18px}
.pbar i{display:block;height:100%;background:var(--accent)}
.err{background:var(--panel);border:1px solid var(--bad);border-left:2px solid var(--bad);border-radius:3px;padding:14px;font-size:14px}
footer{margin-top:34px;font-size:12px;color:var(--muted);font-family:var(--mono);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* révision et examen de niveau */
.lfoot{display:flex;gap:9px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
.lfoot .act{font-size:13px;padding:8px 14px}
.lfoot .act[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.lfoot .info{font-size:12.5px;color:var(--muted);align-self:center}
.mrow.locked{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tabs .act{font-size:13px;padding:8px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 18px;margin:0 0 14px;min-height:150px}
.card .src{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card .recto{font-size:17px;margin:0 0 14px}
.card .verso{font-size:15px;border-top:1px solid var(--line);padding-top:14px;color:var(--fg)}
.boxes{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 14px}
.fiche h3{margin-top:26px}
.fiche dl{margin:0}
.fiche dt{font-weight:700;color:var(--fg);margin-top:12px}
.fiche dd{margin:3px 0 0;color:var(--muted)}
.recap{margin-top:22px}
.recap .corr{margin-bottom:12px}

/* onglets des sections : en haut sur grand écran, barre fixe en bas sur téléphone */
.onglets{order:5;flex:1 0 100%;display:flex;gap:4px;margin:4px 0 -11px}
.onglets a{flex:0 1 auto;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;color:var(--fg-2);text-decoration:none;font-size:14.5px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.onglets a:hover{color:var(--fg)}
.onglets a[aria-current="page"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.onglets a:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
.onglets .court{display:none}
/* cours & révision */
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:11px}
.tuile{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;color:var(--fg);text-decoration:none;min-width:0}
.tuile:hover{border-color:var(--muted)}
.tuile:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.tuile strong{font-family:var(--display);font-size:15px;line-height:1.3}
.t-meta{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.t-prof{font-size:13px;color:var(--fg-2)}
.t-cartes{margin-top:auto;padding-top:8px;font-size:13px;color:var(--muted)}
.t-cartes.chaud b{color:var(--accent);font-size:15px}
.fil{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
.fil a{color:var(--accent)}
.bloc-rev{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:3px;padding:14px 15px}
.bloc-rev p{margin:0}
.bloc-rev b{color:var(--accent)}
.seances{list-style:none;margin:0;padding:0}
.seance{border-left:2px solid var(--line);padding:0 0 14px 13px}
.s-date{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 2px}
.s-sujet{margin:0 0 8px}
.chemin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 9px}
.chemin code{flex:1 1 260px;font-size:12px;padding:6px 8px;user-select:all}
.chemin .copie{font-size:13px;padding:6px 12px;min-height:40px}
.reperes{flex:1 0 100%;font-size:12.5px;color:var(--muted)}
.puces{display:flex;flex-wrap:wrap;gap:7px}
.puce{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:6px 9px;background:var(--panel)}
.puce b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:3px}
a.puce:hover{border-color:var(--muted)}
.puce.ok{border-color:var(--ok)}
.puce.absent{opacity:.55}
.piege{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--bad);border-radius:3px;padding:1px 6px;vertical-align:1px}
.f-src{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
a.lien-act{text-decoration:none;display:inline-flex;align-items:center}
/* sauvegarde de la progression */
.lien-sauve{order:2;font-size:.9rem;color:var(--fg-2);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.lien-sauve.due{color:var(--sur-vif);background:var(--action);border:1.5px solid var(--bord-vif);border-radius:6px;text-decoration:none;font-weight:700;padding:0 11px}
.etat{width:auto;min-width:min(100%,420px);margin:0 0 14px}
.etat td:not(:first-child),.etat th:not(:first-child){text-align:right}
.etat td:first-child{font-family:var(--sans);font-size:14px}
.etat-sync{order:2;font-size:.85rem;color:var(--fg-2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.etat-sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.etat-sync[data-etat="ok"]::before{background:var(--ok)}
.etat-sync[data-etat="attente"]::before{background:var(--accent)}
.etat-sync[data-etat="erreur"]{color:var(--bad);font-weight:700}
.etat-sync[data-etat="erreur"]::before{background:var(--bad)}
.champ-jeton{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 0}
.champ-jeton input{flex:1 1 240px;font-family:var(--mono);font-size:15px;min-height:44px;background:var(--vernis);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:9px 10px;min-width:0}
.etapes-jeton{margin:8px 0 0;padding-left:20px;font-size:14px}
.etapes-jeton li{margin-bottom:4px}
/* réalisations */
.filtres{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px}
.filtre{font-size:13.5px;color:var(--fg-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:0 13px;min-height:40px;display:inline-flex;align-items:center;gap:6px;background:var(--panel)}
.filtre b{font-family:var(--mono);font-weight:500;font-size:11.5px;color:var(--muted)}
.filtre:hover{border-color:var(--muted)}
.filtre[aria-current]{background:var(--action);color:var(--sur-vif);border-color:var(--bord-vif);font-weight:700}
.filtre[aria-current] b{color:var(--sur-vif)}
.frise{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.frise.sans-date{border-left-style:dashed}
.jalon{position:relative;margin:0 0 20px}
.jalon::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.sans-date .jalon::before{background:var(--bg);border-color:var(--muted)}
.j-date{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 6px}
.j-date span{color:var(--muted)}
.real{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 15px}
.r-tete{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.r-tete h3{margin:0;font-size:15.5px}
.r-note{flex:none;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--bg);background:var(--ok);border-radius:3px;padding:2px 8px}
.r-fait{margin:10px 0 0;padding-left:18px;font-size:14px}
.r-fait li{margin-bottom:3px}
.r-comp{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.r-comp span{font-size:12px;color:var(--fg-2);background:var(--panel-2);border-radius:3px;padding:3px 8px}
.r-lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
/* TP */
.tp-carte{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:14px 15px;margin:0 0 14px}
.tp-carte.urgent{border-color:var(--bad);border-left-color:var(--bad)}
.tp-carte.urgent .compte{color:var(--bad)}
.tp-statut{flex:none;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--fg-2)}
.tp-statut.s-en_cours{border-color:var(--accent);color:var(--accent)}
.tp-statut.s-note{color:var(--bg);background:var(--ok);border-color:var(--ok);font-weight:700}
.tp-echeance{font-size:14px;margin:8px 0 0;color:var(--fg-2)}
.tp-echeance .compte{color:var(--fg)}
.tp-barre{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:12px 0 0}
.tp-barre i{display:block;height:100%;background:var(--accent)}
.tp-etapes{list-style:none;margin:0;padding:0}
.tp-etapes label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:40px;cursor:pointer;font-size:14.5px;border-top:1px solid var(--line)}
.tp-etapes input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.tp-etapes input:checked+span{color:var(--muted);text-decoration:line-through}
.tp-etapes label.ref{cursor:default}
.tp-rem{margin:12px 0 0;padding:10px 12px 10px 28px;background:var(--panel-2);border-radius:3px;font-size:13.5px;color:var(--fg-2)}
/* contrôles et examen blanc */
.a-confirmer{margin:10px 0 0;padding:9px 12px;border-radius:3px;background:color-mix(in srgb,var(--action) 22%,var(--panel));border-left:3px solid var(--action);font-size:14px}
.info-blanc{font-size:13px;color:var(--muted);align-self:center}
.minuteur{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 14px}
.minuteur i{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s linear}
/* rappel en tête du parcours */
.rappel-esgi{display:grid;gap:8px;margin:0 0 20px}
.rappel-esgi a{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:10px 13px;color:var(--fg-2);text-decoration:none;font-size:14px}
.rappel-esgi a:hover{border-color:var(--muted);border-left-color:var(--accent)}
.rappel-esgi a.urgent{border-left-color:var(--bad)}
.rappel-esgi span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rappel-esgi b{color:var(--fg)}
.cadre-sauve{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 15px;margin:0 0 18px}
.cadre-sauve h2{margin-top:0}
.choix-mode{display:grid;gap:8px;margin:12px 0}

<script>
/* ============================================================
   MOTEUR — ne contient aucun contenu de cours.
   Le contenu vit dans curriculum.json et modules/<id>.json
   ============================================================ */

const R=n=>Math.floor(Math.random()*n);
const bin8=n=>n.toString(2).padStart(8,"0");
const grp=b=>b.slice(0,4)+" "+b.slice(4);
const hex2=n=>n.toString(16).toUpperCase().padStart(2,"0");
const norm=s=>String(s).replace(/\s+/g,"").toUpperCase();
const ipInt=ip=>ip.split(".").reduce((a,o)=>(a*256)+(+o),0)>>>0;
const intIp=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join(".");
const esc=s=>String(s).replace(/&(?![a-z]+;|#)/g,"&amp;");

/* ---------- état ---------- */
const KEY="formation.cyber.v1";
let prog={};
try{const r=localStorage.getItem(KEY); if(r) prog=JSON.parse(r)||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}

let CUR=null, INDEX=[];

/* ============================================================
   GÉNÉRATEURS D'EXERCICES
   Chacun retourne {prompt, given, fields[], answers{}, explain(ok)}
   Pour en ajouter un : écrire make<Nom>() puis l'inscrire dans GENERATORS.
   ============================================================ */

function makeConvBin(){
  const n=R(256);
  return {
    prompt:"Convertis ce nombre décimal en binaire sur 8 bits.",
    given:String(n),
    fields:[{k:"b",label:"Binaire",ph:"0000 0000"}],
    answers:{b:bin8(n)},
    norm:v=>norm(v),
    explain(){
      let s="",rest=n;
      [128,64,32,16,8,4,2,1].forEach(p=>{
        if(rest>=p){s+=`${String(rest).padStart(3)} − <b>${String(p).padStart(3)}</b> = ${String(rest-p).padStart(3)}   → <b>1</b>\n`;rest-=p;}
        else{s+=`${String(rest).padStart(3)}   (${p} > reste)      → <b>0</b>\n`;}
      });
      return `<pre>${s}\n${n} = <b>${grp(bin8(n))}</b></pre>`;
    }
  };
}

function makeConvTriple(){
  const n=R(256);
  const from=["bin","hex","dec"][R(3)];
  const shown= from==="bin"?grp(bin8(n)) : from==="hex"?"0x"+hex2(n) : String(n);
  return {
    prompt:"Donne les trois écritures de cet octet.",
    given:shown,
    fields:[{k:"d",label:"Décimal",ph:"0-255"},{k:"b",label:"Binaire",ph:"0000 0000"},{k:"h",label:"Hexa",ph:"00"}],
    answers:{d:String(n),b:bin8(n),h:hex2(n)},
    norm:(v,k)=>k==="h"?norm(v).replace(/^0X/,""):norm(v),
    explain(){
      const b=bin8(n);
      return `<p>Décimal <b>${n}</b> · Binaire <b>${grp(b)}</b> · Hexa <b>0x${hex2(n)}</b></p>
      <pre>Nibble haut : ${b.slice(0,4)} = ${parseInt(b.slice(0,4),2)} = <b>${hex2(n)[0]}</b>
Nibble bas  : ${b.slice(4)} = ${parseInt(b.slice(4),2)} = <b>${hex2(n)[1]}</b></pre>
      <p>Chaque groupe de 4 bits se traduit indépendamment. Aucun calcul sur l'octet entier n'est nécessaire.</p>`;
    }
  };
}

function makeBitop(){
  const op=["ET","OU","XOR"][R(3)], a=R(256), b=R(256);
  const r= op==="ET"?(a&b): op==="OU"?(a|b):(a^b);
  const rule={ET:"1 seulement si les deux bits valent 1",OU:"1 si au moins un bit vaut 1",XOR:"1 si les deux bits diffèrent"}[op];
  return {
    prompt:`Applique l'opération ${op} bit à bit entre ces deux octets.`,
    given:`${a} ${op} ${b}`,
    fields:[{k:"r",label:"Résultat décimal",ph:"0-255"}],
    answers:{r:String(r)},
    norm:v=>String(v).trim(),
    explain(){
      return `<pre>  ${grp(bin8(a))}   <span class="c">(${a})</span>
  ${grp(bin8(b))}   <span class="c">(${b})</span>
  ─────────── ${op}
  <b>${grp(bin8(r))}</b>   <span class="c">(${r})</span></pre>
      <p>Règle du ${op} : ${rule}. Chaque colonne se traite séparément, il n'y a jamais de retenue.</p>`;
    }
  };
}

function makeSubnet(){
  const prefix=17+R(13);
  const base=((10<<24)>>>0)+(R(256)<<16)+(R(256)<<8)+R(256);
  const mask=(0xFFFFFFFF<<(32-prefix))>>>0;
  const net=(base&mask)>>>0, bc=(net|(~mask>>>0))>>>0;
  const hosts=Math.pow(2,32-prefix)-2;
  return {
    prompt:"Donne les quatre valeurs de ce réseau.",
    given:`${intIp(base)}/${prefix}`,
    fields:[{k:"n",label:"Adresse réseau",ph:"x.x.x.x"},{k:"m",label:"Masque",ph:"x.x.x.x"},
            {k:"b",label:"Broadcast",ph:"x.x.x.x"},{k:"h",label:"Hôtes adressables",ph:"nombre"}],
    answers:{n:intIp(net),m:intIp(mask),b:intIp(bc),h:String(hosts)},
    norm:v=>String(v).trim(),
    explain(){
      const mo=intIp(mask).split(".").map(Number), ad=intIp(base).split(".").map(Number);
      const k=mo.findIndex(x=>x!==255), bloc=256-mo[k], v=ad[k], debut=Math.floor(v/bloc)*bloc;
      const rang=["1er","2e","3e","4e"][k];
      return `<pre>1. Masque /${prefix} = ${mo.map((x,i)=>i===k?`<b>${x}</b>`:x).join(".")}   → octet intéressant : le ${rang}
2. Bloc = 256 − ${mo[k]} = <b>${bloc}</b>
3. Dans l'adresse, ${rang} octet = ${v}
   plus grand multiple de ${bloc} qui ne dépasse pas ${v} : <b>${debut}</b>
   octets suivants à 0      → réseau    <b>${intIp(net)}</b>
4. ${debut} + ${bloc} − 1 = ${debut+bloc-1}, octets suivants à 255
                            → broadcast <b>${intIp(bc)}</b>

Hôtes : 2^(32−${prefix}) − 2 = <b>${hosts}</b>   <span class="c">réseau et broadcast exclus</span></pre>
      <p>L'octet intéressant se repère toujours sur le masque, jamais sur l'adresse.${k<3?" Ici la frontière tombe avant le dernier octet : la valeur "+ad[3]+" du dernier octet ne joue aucun rôle dans le calcul.":""}</p>`;
    }
  };
}

/* /n ↔ masque, dans les deux sens (n0-3, section 2) */
const MASK_OCT=[0,128,192,224,240,248,252,254,255];
function prefixToMask(n){return [0,1,2,3].map(i=>MASK_OCT[Math.max(0,Math.min(8,n-8*i))]).join(".");}
function makeCidr(){
  const n=8+R(23), masque=prefixToMask(n), sens=R(2);
  const plein=Math.floor(n/8), reste=n%8;
  const decoupe=[...Array(plein).fill(8),...(reste?[reste]:[])].join(" + ");
  return {
    prompt: sens? "Écris le masque correspondant à ce préfixe." : "Écris le préfixe correspondant à ce masque.",
    given: sens? `/${n}` : masque,
    fields:[ sens? {k:"m",label:"Masque",ph:"x.x.x.x"} : {k:"p",label:"Préfixe",ph:"/n"} ],
    answers: sens? {m:masque} : {p:String(n)},
    norm:(v,k)=>k==="p"?String(v).replace(/[\s\/]/g,""):String(v).replace(/\s+/g,""),
    explain(){
      return `<pre>/${n}  =  ${decoupe}
${reste?`le dernier paquet compte ${reste} bit${reste>1?"s":""} à 1 → table : <b>${MASK_OCT[reste]}</b>   <span class="c">(${MASK_OCT[reste].toString(2).padStart(8,"0").replace(/(.{4})/,"$1 ")})</span>\n`:""}${plein} octet${plein>1?"s":""} plein${plein>1?"s":""} à 255, le reste à 0

/${n}  =  <b>${masque}</b></pre>
      <p>Les neuf valeurs possibles d'un octet de masque sont 0, 128, 192, 224, 240, 248, 252, 254 et 255. Dans le sens masque vers préfixe, on compte 8 par octet à 255, puis le nombre de 1 de l'octet suivant.</p>`;
    }
  };
}

/* découpage d'un /24 en N sous-réseaux égaux (n0-3, section 4) */
function makeDecoupe(){
  const N=2+R(39), k=Math.ceil(Math.log2(N)), pre=24+k, bloc=256>>k, hotes=bloc-2;
  const reseau=R(2)?`192.168.${R(256)}`:`10.${R(256)}.${R(256)}`;
  const j=1+R(N), debut=(j-1)*bloc;
  const essais=[]; for(let t=Math.max(1,k-1);t<=k;t++) essais.push(`k = ${t}  →  2^${t} = ${2**t}${2**t>=N?"   <b>suffisant</b>":"   insuffisant"}`);
  return {
    prompt:`On découpe ${reseau}.0/24 pour obtenir au moins ${N} sous-réseaux de même taille. Donne le nouveau préfixe, le nombre de machines par sous-réseau, et l'adresse du sous-réseau n° ${j} (le n° 1 commence en .0).`,
    given:`${reseau}.0/24  →  ${N} sous-réseaux`,
    fields:[{k:"p",label:"Nouveau préfixe",ph:"/n"},{k:"h",label:"Machines par sous-réseau",ph:"nombre"},
            {k:"s",label:`Adresse du n° ${j}`,ph:"x.x.x.x"}],
    answers:{p:String(pre),h:String(hotes),s:`${reseau}.${debut}`},
    norm:(v,k)=>k==="p"?String(v).replace(/[\s\/]/g,""):String(v).replace(/\s+/g,""),
    explain(){
      return `<pre>Il faut 2^k ≥ ${N}
${essais.join("\n")}

Nouveau préfixe : 24 + ${k} = <b>/${pre}</b>
Bloc            : 2^(32 − ${pre}) = <b>${bloc}</b> adresses
Machines        : ${bloc} − 2 = <b>${hotes}</b>
Sous-réseau n° ${j} : (${j} − 1) × ${bloc} = ${debut}   → <b>${reseau}.${debut}</b></pre>
      <p>Le décalage est le piège classique : le sous-réseau n° 1 commence à 0, donc le n° ${j} commence à ${j-1} fois le bloc, pas ${j} fois.</p>`;
    }
  };
}

/* ---------- outils communs aux en-têtes réseau ---------- */
const PROTOS={1:"ICMP",6:"TCP",17:"UDP"};
/* Les ports doivent rester identiques au tableau de la section 5 de n0-2. */
const SERVICES=[
  {p:22,n:"SSH",t:6},{p:25,n:"SMTP",t:6},{p:80,n:"HTTP",t:6},{p:443,n:"HTTPS",t:6},
  {p:445,n:"SMB",t:6},{p:3389,n:"RDP",t:6},{p:53,n:"DNS",t:17},{p:123,n:"NTP",t:17},{p:161,n:"SNMP",t:17}
];
const h2=b=>b.toString(16).toUpperCase().padStart(2,"0");
const w16=n=>[(n>>>8)&255,n&255];
const ipB=ip=>ip.split(".").map(Number);
/* somme de contrôle Internet : complément à un de la somme des mots de 16 bits */
function cksum(bytes){
  let s=0;
  for(let i=0;i<bytes.length;i+=2) s+=(bytes[i]<<8)|(bytes[i+1]||0);
  while(s>>>16) s=(s&0xFFFF)+(s>>>16);
  return (~s)&0xFFFF;
}
function randIp(){
  const k=R(4);
  if(k===0) return `192.168.${R(256)}.${1+R(254)}`;
  if(k===1) return `10.${R(256)}.${R(256)}.${1+R(254)}`;
  if(k===2) return `172.${16+R(16)}.${R(256)}.${1+R(254)}`;
  let a; do{a=1+R(223);}while([10,127,169,172,192].includes(a));
  return `${a}.${R(256)}.${R(256)}.${1+R(254)}`;
}
function ipv4Header(o){
  const b=[0x45,0,...w16(o.len),...w16(o.id),o.df?0x40:0,0,o.ttl,o.proto,0,0,...ipB(o.src),...ipB(o.dst)];
  const c=cksum(b); b[10]=c>>>8; b[11]=c&255;
  return b;
}
const hexLine=a=>a.map(h2).join(" ");
const byteDec=x=>`${h2(x)} = ${parseInt(h2(x)[0],16)}×16 + ${parseInt(h2(x)[1],16)} = <b>${x}</b>`;
const ipDecode=a=>a.map(x=>`  ${byteDec(x)}`).join("\n");

function makeIpv4(){
  const proto=[1,6,17][R(3)];
  const initTtl=[64,128,255][R(3)], ttl=initTtl-R(25);
  const len=20+(proto===1?8+R(56):proto===6?20+R(200):8+R(120));
  const src=randIp(), dst=randIp();
  const b=ipv4Header({len,id:R(65536),df:R(2),ttl,proto,src,dst});
  const rows=[0,4,8,12,16].map(o=>`+${String(o).padStart(2,"0")}&nbsp;&nbsp;${hexLine(b.slice(o,o+4))}`).join("<br>");
  return {
    prompt:"Voici un en-tête IPv4 capturé, quatre octets par ligne, décalage à gauche. Extrais les quatre champs demandés.",
    given:rows,
    fields:[{k:"t",label:"TTL (décimal)",ph:"0-255"},{k:"p",label:"Protocole",ph:"nom ou numéro"},
            {k:"s",label:"IP source",ph:"x.x.x.x"},{k:"d",label:"IP destination",ph:"x.x.x.x"}],
    answers:{t:String(ttl),p:PROTOS[proto],s:src,d:dst},
    norm:(v,k)=>{
      let s=String(v).replace(/\s+/g,"").toUpperCase();
      if(k==="p"){
        if(/^0X[0-9A-F]+$/.test(s)) s=String(parseInt(s.slice(2),16));
        if(/^\d+$/.test(s)) s=PROTOS[+s]||s;
      }
      return s;
    },
    explain(){
      const guess=initTtl===255?"255 : typiquement un équipement réseau":initTtl===128?"128 : typiquement Windows":"64 : typiquement Linux, macOS ou Android";
      return `<pre>Octet 0       <b>${h2(b[0])}</b>   <span class="c">nibble haut 4 = IPv4, nibble bas 5 = 5 mots de 4 octets = 20 octets d'en-tête</span>
Octets 2-3    ${h2(b[2])} ${h2(b[3])}   <span class="c">longueur totale = ${b[2]}×256 + ${b[3]} = ${len} octets</span>
Octet 8       <b>${h2(b[8])}</b>   TTL : ${byteDec(b[8])}
Octet 9       <b>${h2(b[9])}</b>   protocole : ${proto} → <b>${PROTOS[proto]}</b>   <span class="c">1 = ICMP, 6 = TCP, 17 = UDP</span>

Octets 12-15  source, un octet à la fois :
${ipDecode(b.slice(12,16))}
  → <b>${src}</b>

Octets 16-19  destination :
${ipDecode(b.slice(16,20))}
  → <b>${dst}</b></pre>
      <p>Le TTL lu vaut ${ttl}. La valeur de départ probable est la plus petite valeur, parmi 64, 128 et 255, qui soit supérieure ou égale à ${ttl}, soit ${guess}, ${initTtl===ttl?"et le paquet n'a traversé aucun routeur":`et le paquet a traversé ${initTtl-ttl} routeur${initTtl-ttl>1?"s":""}`}. L'erreur classique est de compter les octets à partir de 1 : le TTL est à l'octet 8 en comptant depuis 0, c'est-à-dire le premier octet de la troisième ligne.</p>`;
    }
  };
}

function makePaquet(){
  const sv=SERVICES[R(SERVICES.length)];
  const sport=49152+R(16384), src=randIp(), dst=randIp();
  const randB=n=>Array.from({length:n},()=>R(256));
  const mac=()=>{const m=randB(6); m[0]&=0xFC; return m;};
  let l4;
  if(sv.t===6){
    l4=[...w16(sport),...w16(sv.p),...randB(4),0,0,0,0,0x50,0x02,0xFA,0xF0,0,0,0,0];
  }else{
    const pl=randB(4+R(12));
    l4=[...w16(sport),...w16(sv.p),...w16(8+pl.length),0,0,...pl];
  }
  const ip=ipv4Header({len:20+l4.length,id:R(65536),df:1,ttl:[64,128][R(2)],proto:sv.t,src,dst});
  const pseudo=[...ipB(src),...ipB(dst),0,sv.t,...w16(l4.length)];
  const c=cksum([...pseudo,...l4]);
  const ck=sv.t===6?16:6, cv=(sv.t===17&&c===0)?0xFFFF:c; l4[ck]=cv>>>8; l4[ck+1]=cv&255;
  const all=[...mac(),...mac(),0x08,0x00,...ip,...l4];
  const lines=[];
  for(let o=0;o<all.length;o+=16){
    const a=all.slice(o,o+16);
    lines.push(o.toString(16).padStart(4,"0")+"&nbsp;&nbsp;"+hexLine(a.slice(0,8))+(a.length>8?"&nbsp;&nbsp;"+hexLine(a.slice(8)):""));
  }
  const name=PROTOS[sv.t];
  return {
    prompt:"Voici une trame Ethernet capturée en entier, seize octets par ligne, décalage en hexadécimal à gauche. Un poste ouvre une communication vers un serveur. Identifie le transport, les deux ports et le service visé.",
    given:lines.join("<br>"),
    fields:[{k:"t",label:"Transport",ph:"TCP ou UDP"},{k:"s",label:"Port source",ph:"0-65535"},
            {k:"d",label:"Port destination",ph:"0-65535"},{k:"n",label:"Service",ph:"ex. SSH"}],
    answers:{t:name,s:String(sport),d:String(sv.p),n:sv.n},
    norm:(v,k)=>{
      let s=String(v).replace(/\s+/g,"").toUpperCase();
      if(k==="t"&&/^\d+$/.test(s)) s=PROTOS[+s]||s;
      return s;
    },
    explain(){
      const p=all.slice(34,38);
      return `<pre>0x00-0x05   ${hexLine(all.slice(0,6))}   <span class="c">MAC destination</span>
0x06-0x0B   ${hexLine(all.slice(6,12))}   <span class="c">MAC source</span>
0x0C-0x0D   <b>08 00</b>                <span class="c">EtherType : IPv4 suit</span>

0x0E        <b>45</b>   <span class="c">début de l'en-tête IP, IHL 5 → 20 octets</span>
0x17        <b>${h2(sv.t)}</b>   <span class="c">octet 9 de l'en-tête IP (14 + 9 = 23 = 0x17) : protocole ${sv.t} → ${name}</span>

Le transport commence à 14 + 20 = 34 = <b>0x22</b>, troisième octet de la troisième ligne.
0x22-0x23   ${h2(p[0])} ${h2(p[1])}   port source      = ${p[0]}×256 + ${p[1]} = <b>${sport}</b>
0x24-0x25   ${h2(p[2])} ${h2(p[3])}   port destination = ${p[2]}×256 + ${p[3]} = <b>${sv.p}</b> → <b>${sv.n}</b></pre>
      <p>Le port source, au-dessus de 49152, est un port éphémère choisi au hasard par le système du client : il ne désigne aucun service. C'est le port destination, bas et connu, qui dit à quoi le poste veut parler. L'erreur fréquente est de chercher les ports juste après l'EtherType : il faut d'abord sauter les 20 octets de l'en-tête IP, dont la longueur se lit dans le nibble bas de l'octet 0x0E.</p>`;
    }
  };
}

const GENERATORS={convBin:makeConvBin,convTriple:makeConvTriple,bitop:makeBitop,subnet:makeSubnet,cidr:makeCidr,decoupe:makeDecoupe,ipv4:makeIpv4,paquet:makePaquet};

/* ============================================================
   RENDU
   ============================================================ */
const view=document.getElementById("view");

function blockHtml(b){
  switch(b.t){
    case "p":    return `<p>${b.v}</p>`;
    case "h3":   return `<h3>${b.v}</h3>`;
    case "pre":  return `<pre>${esc(b.v)}</pre>`;
    case "note": return `<p class="note">${b.v}</p>`;
    case "table":{
      const head=b.head.map(h=>`<th>${h}</th>`).join("");
      const rows=b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("");
      return `<div class="tscroll"><table><tr>${head}</tr>${rows}</table></div>`;
    }
    default: return "";
  }
}

/* --- exercice interactif --- */
let exSeq=0;
function exerciseHtml(spec,mod){
  const id="ex"+(++exSeq);
  if(spec.gen==="qcm") return `<div class="ex" id="${id}" data-qcm="1"></div>`;
  return `<div class="ex" id="${id}" data-gen="${spec.gen}"></div>`;
}
function mountExercise(el,mod){
  if(el.dataset.qcm){ return mountQcm(el,mod); }
  const g=GENERATORS[el.dataset.gen];
  if(!g){ el.innerHTML=`<div class="err">Générateur inconnu : <code>${el.dataset.gen}</code>. Ajoute-le dans app/index.html.</div>`; return; }
  function round(){
    const x=g();
    el.innerHTML=`<p class="tag-ex">Exercice</p><p style="font-size:15px;margin:0 0 10px">${x.prompt}</p>
      <p class="given">${x.given}</p>
      <div class="conv">${x.fields.map(f=>`<div class="cell"><span>${f.label}</span><input data-k="${f.k}" autocomplete="off" placeholder="${f.ph}"></div>`).join("")}</div>
      <div class="row"><button class="act" data-a="check">Vérifier</button><button class="act ghost" data-a="new">Autre énoncé</button></div>
      <div class="slot"></div>`;
    el.querySelector('[data-a="new"]').onclick=round;
    el.querySelector('[data-a="check"]').onclick=()=>{
      let all=true;
      el.querySelectorAll("input[data-k]").forEach(i=>{
        const k=i.dataset.k;
        const ok=(x.norm?x.norm(i.value,k):String(i.value).trim())===x.answers[k];
        i.classList.toggle("good",ok);i.classList.toggle("bad",!ok);
        if(!ok)all=false;
      });
      el.querySelector(".slot").innerHTML=
        `<div class="corr" data-ok="${all?1:0}"><h4>${all?"Juste":"Faux — voici le raisonnement"}</h4>${x.explain(all)}</div>`;
    };
  }
  round();
}
/* Mélange les options d'une question à chaque affichage.
   Sans ça, la bonne réponse reste toujours à la même place et se devine sans rien savoir. */
function shuffleQ(src){
  const idx=src.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return {q:src.q, w:src.w, o:idx.map(i=>src.o[i]), a:idx.indexOf(src.a)};
}

function mountQcm(el,mod){
  if(!mod.qcm||!mod.qcm.length){el.innerHTML=`<div class="err">Ce module n'a pas de QCM.</div>`;return;}
  let pool=[];
  function round(){
    if(!pool.length) pool=mod.qcm.map((_,i)=>i).sort(()=>Math.random()-.5);
    const q=shuffleQ(mod.qcm[pool.pop()]);
    el.innerHTML=`<p class="tag-ex">Exercice · raisonnement</p><p style="font-size:15px;margin:0 0 12px">${q.q}</p>
      <div class="opts"></div><div class="slot"></div>
      <div class="row"><button class="act ghost" data-a="new" hidden>Question suivante</button></div>`;
    const box=el.querySelector(".opts"), next=el.querySelector('[data-a="new"]');
    next.onclick=round;
    q.o.forEach((t,i)=>{
      const b=document.createElement("button");
      b.className="opt";b.type="button";
      b.innerHTML=`<span class="k">${"ABCD"[i]}</span><span>${t}</span>`;
      b.onclick=()=>{
        [...box.children].forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("good");else if(j===i)x.classList.add("bad");});
        el.querySelector(".slot").innerHTML=`<div class="corr" data-ok="${i===q.a?1:0}"><h4>${i===q.a?"Juste":"Faux — voici le raisonnement"}</h4><p>${q.w}</p></div>`;
        next.hidden=false;
      };
      box.appendChild(b);
    });
  }
  round();
}

/* --- page module --- */
function renderModule(mod){
  if(mod.format===2) return renderModuleV2(mod);
  exSeq=0;
  const secs=mod.sections.map((s,i)=>`
    <h2><span class="n">SECTION ${i+1}</span>${s.title}</h2>
    ${s.blocks.map(blockHtml).join("")}
    ${s.exercise?exerciseHtml(s.exercise,mod):""}`).join("");
  const pass=(mod.eval&&mod.eval.pass)||4, count=(mod.eval&&mod.eval.count)||5;
  view.innerHTML=`
    <p style="font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px">
      NIVEAU ${mod.level} · MODULE <b style="color:var(--accent)">${mod.id}</b> · ${mod.duration||""}</p>
    <h1>${mod.title}</h1>
    <p class="sub">${mod.subtitle||""}</p>
    <div class="why"><p><strong>Pourquoi ce module existe.</strong> ${mod.why}</p></div>
    ${secs}
    <div class="eval">
      <p class="tag-ex">Évaluation du module</p>
      <p style="margin:0 0 4px">${count} questions, sans retour en arrière. Il faut <strong>${pass} sur ${count}</strong> pour valider ${mod.id}.</p>
      <div class="row"><button class="act" id="go-eval">Lancer l'évaluation</button></div>
      <div id="eval-body"></div>
    </div>
    <div class="row"><button class="act ghost" id="back">Retour au sommaire</button></div>`;
  view.querySelectorAll(".ex").forEach(el=>mountExercise(el,mod));
  document.getElementById("back").onclick=renderIndex;
  document.getElementById("go-eval").onclick=()=>runEval(mod);
  window.scrollTo(0,0);
}

function runEval(mod){
  const count=(mod.eval&&mod.eval.count)||5, pass=(mod.eval&&mod.eval.pass)||4;
  const gens=[...new Set(mod.sections.filter(s=>s.exercise&&s.exercise.gen!=="qcm").map(s=>s.exercise.gen))];
  const items=[];
  const nGen=Math.min(gens.length, Math.max(0,count-2));
  for(let i=0;i<nGen;i++) items.push({type:"gen",g:gens[i%gens.length]});
  const picks=mod.qcm.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,count-items.length);
  picks.forEach(i=>items.push({type:"qcm",q:shuffleQ(mod.qcm[i])}));
  items.sort(()=>Math.random()-.5);

  const body=document.getElementById("eval-body");
  document.getElementById("go-eval").hidden=true;
  let i=0,good=0;
  function step(){
    if(i>=items.length){
      const ok=good>=pass;
      if(ok){prog[mod.id]=true;save();paintGlobal();}
      body.innerHTML=`<div class="pbar"><i style="width:100%"></i></div>
        <div class="big">${good} / ${items.length}</div>
        <p class="gate">${ok?"Module validé.":"Pas encore. Reprends les sections où tu as buté, puis relance."}</p>
        <div class="row" style="justify-content:center">
          <button class="act ghost" id="re">Relancer</button>
          <button class="act" id="idx">Sommaire</button></div>`;
      document.getElementById("re").onclick=()=>{document.getElementById("go-eval").hidden=false;body.innerHTML="";};
      document.getElementById("idx").onclick=renderIndex;
      return;
    }
    const it=items[i];
    const head=`<div class="pbar"><i style="width:${i/items.length*100}%"></i></div>
      <p class="tag-ex" style="color:var(--muted)">Question ${i+1} / ${items.length}</p>`;
    if(it.type==="gen"){
      const x=GENERATORS[it.g]();
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 10px">${x.prompt}</p><p class="given">${x.given}</p>
        <div class="conv">${x.fields.map(f=>`<div class="cell"><span>${f.label}</span><input data-k="${f.k}" autocomplete="off" placeholder="${f.ph}"></div>`).join("")}</div>
        <div class="row"><button class="act" id="go">Valider</button></div>`;
      document.getElementById("go").onclick=()=>{
        let all=true;
        body.querySelectorAll("input[data-k]").forEach(inp=>{
          const k=inp.dataset.k;
          if((x.norm?x.norm(inp.value,k):String(inp.value).trim())!==x.answers[k]) all=false;
        });
        if(all)good++; i++; step();
      };
    }else{
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 12px">${it.q.q}</p><div class="opts"></div>`;
      const box=body.querySelector(".opts");
      it.q.o.forEach((t,j)=>{
        const b=document.createElement("button");
        b.className="opt";b.type="button";
        b.innerHTML=`<span class="k">${"ABCD"[j]}</span><span>${t}</span>`;
        b.onclick=()=>{if(j===it.q.a)good++;i++;step();};
        box.appendChild(b);
      });
    }
  }
  step();
}

/* --- sommaire --- */
/* Un niveau est ouvert si le niveau précédent a son examen validé. Le N0 est toujours ouvert. */
function niveauOuvert(L){
  if(L.n===0) return true;
  const prec=CUR.niveaux.find(x=>x.n===L.n-1);
  return !prec || !!prog["examen-n"+prec.n];
}
function renderIndex(){
  if(location.hash) history.replaceState(null,"",location.pathname);
  marquerOnglet("parcours");
  const lv=CUR.niveaux.map(L=>{
    const tot=L.modules.length;
    const done=L.modules.filter(m=>prog[m.id]).length;
    const ouvert=niveauOuvert(L);
    const ecrits=L.modules.filter(m=>INDEX.includes(m.id)).length;
    const rows=L.modules.map(m=>{
      const exists=INDEX.includes(m.id);
      const lock=exists&&!ouvert;
      const tag=!exists?"à écrire":lock?"verrouillé":m.id;
      return `<button class="mrow ${prog[m.id]?"ok":""} ${exists?"":"missing"} ${lock?"locked":""}" data-id="${m.id}" ${exists&&!lock?"":"disabled"}>
        <span class="dot"></span>
        <span class="mt"><b>${m.titre}</b><em>${m.resume}</em></span>
        <span class="tag">${tag}</span></button>`;
    }).join("");
    const examOk=!!prog["examen-n"+L.n];
    const examPret=done===tot;
    const foot = ecrits===0 ? "" : `<div class="lfoot">
        <button class="act ghost" data-rev="${L.n}" ${ouvert?"":"disabled"}>Réviser le niveau</button>
        <button class="act ${examOk?"ghost":""}" data-exam="${L.n}" ${examPret&&ouvert?"":"disabled"}>${examOk?"Examen N"+L.n+" validé — repasser":"Examen du niveau N"+L.n}</button>
        <span class="info">${!ouvert?"Valide l'examen N"+(L.n-1)+" pour ouvrir ce niveau.":examOk?"Niveau validé.":examPret?"Tous les modules sont validés : l'examen est ouvert.":"Examen ouvert quand les "+tot+" modules seront validés ("+done+"/"+tot+")."}</span>
      </div>`;
    return `<section class="lvl">
      <button class="lhead"><span class="num">N${L.n}</span>
        <span class="tx"><strong>${L.titre}</strong><em>${L.but}</em></span>
        <span class="pc">${done}/${tot}</span></button>
      <div class="lbody">${rows}${foot}</div></section>`;
  }).join("");
  view.innerHTML=`<h1>${CUR.titre}</h1>
    <p class="sub">${CUR.niveaux.length} niveaux, ${INDEX.length} modules écrits sur ${CUR.niveaux.reduce((a,l)=>a+l.modules.length,0)}. Un module se valide par son évaluation, un niveau par son examen.</p>
    <div id="rappel-esgi" class="rappel-esgi" hidden></div>
    ${lv}`;
  view.querySelectorAll(".lhead").forEach(h=>{
    const body=h.nextElementSibling;
    h.onclick=()=>{body.hidden=!body.hidden;};
  });
  view.querySelectorAll(".mrow:not(.missing):not(.locked)").forEach(b=>{
    b.onclick=()=>openModule(b.dataset.id);
  });
  view.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>renderRevision(+b.dataset.rev));
  view.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>renderLevelExam(+b.dataset.exam));
  remplirRappel();
  window.scrollTo(0,0);
}

/* ============================================================
   RÉVISION — cartes et fiche
   Les cartes viennent du champ "cartes" de chaque module : [{r, v}]
   Répétition espacée simple (boîtes 1 à 5) : une carte ratée retourne en boîte 1,
   une carte sue monte d'une boîte. Les boîtes basses passent en priorité.
   ============================================================ */
const KEYC="formation.cyber.cartes.v1";
let boites={};
try{const r=localStorage.getItem(KEYC); if(r) boites=JSON.parse(r)||{};}catch(e){}
function saveBoites(){try{localStorage.setItem(KEYC,JSON.stringify(boites))}catch(e){}}

async function chargerNiveau(n){
  const L=CUR.niveaux.find(x=>x.n===n);
  const ids=L.modules.map(m=>m.id).filter(id=>INDEX.includes(id));
  const mods=await Promise.all(ids.map(id=>fetch(`../modules/${id}.json`).then(r=>r.json())));
  return {L,mods};
}

async function renderRevision(n){
  view.innerHTML=`<p class="sub">Chargement…</p>`;
  let L,mods;
  try{({L,mods}=await chargerNiveau(n));}catch(e){view.innerHTML=`<div class="err">Impossible de charger les modules du niveau.</div>`;return;}
  const cartes=[];
  mods.forEach(m=>(m.cartes||[]).forEach((c,i)=>cartes.push({id:`${m.id}#${i}`,mod:m.id,titre:m.title,r:c.r,v:c.v})));
  const sansCartes=mods.filter(m=>!(m.cartes&&m.cartes.length)).map(m=>m.id);

  function entete(onglet){
    const parBoite=[1,2,3,4,5].map(b=>cartes.filter(c=>(boites[c.id]||1)===b).length);
    return `<p style="font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px">NIVEAU ${L.n} · RÉVISION</p>
      <h1>${L.titre}</h1>
      <p class="sub">${cartes.length} cartes issues de ${mods.length} module${mods.length>1?"s":""}.${sansCartes.length?" Sans cartes pour l'instant : "+sansCartes.join(", ")+".":""}</p>
      <div class="tabs">
        <button class="act ${onglet==="cartes"?"":"ghost"}" id="t-cartes">Cartes</button>
        <button class="act ${onglet==="fiche"?"":"ghost"}" id="t-fiche">Fiche du niveau</button>
        <button class="act ghost" id="t-back">Sommaire</button>
      </div>
      ${onglet==="cartes"?`<p class="boxes">Boîtes 1 → 5 : ${parBoite.join(" · ")} <span class="c">— la boîte 1 regroupe ce qui n'est pas encore acquis</span></p>`:""}`;
  }
  function onglets(){
    document.getElementById("t-cartes").onclick=session;
    document.getElementById("t-fiche").onclick=fiche;
    document.getElementById("t-back").onclick=renderIndex;
  }

  function fiche(){
    const parMod=mods.map(m=>`<h3>${m.id} — ${m.title}</h3><dl>${(m.cartes||[]).map(c=>`<dt>${c.r}</dt><dd>${c.v}</dd>`).join("")||"<dd>Pas encore de cartes pour ce module.</dd>"}</dl>`).join("");
    view.innerHTML=entete("fiche")+`<div class="fiche">${parMod}</div>`;
    onglets(); window.scrollTo(0,0);
  }

  function session(){
    sessionCartes({cartes:cartes.map(c=>({...c,etiquette:c.mod})),boites,sauver:saveBoites,
      entete:()=>entete("cartes"),lier:onglets,vide:"Aucune carte dans ce niveau pour l'instant."});
  }
  session();
}

/* Moteur de boîtes, commun au parcours et aux matières ESGI.
   o.cartes : [{id, r, v, etiquette, piege?}] · o.boites : {id → boîte} · o.sauver() · o.entete() → html · o.lier() */
function sessionCartes(o){
  const {cartes,boites}=o;
  if(!cartes.length){view.innerHTML=o.entete()+`<div class="err">${o.vide}</div>`;o.lier();return;}
  /* priorité aux boîtes basses, mélange à l'intérieur de chaque boîte, 20 cartes max */
  const tirage=cartes.map(c=>({c,k:(boites[c.id]||1)+Math.random()})).sort((a,b)=>a.k-b.k).slice(0,20).map(x=>x.c);
  let i=0, sues=0, ratees=0;
  function carte(){
    if(i>=tirage.length){
      view.innerHTML=o.entete()+`<div class="card"><p class="src">Session terminée</p>
        <p class="recto">${sues} sue${sues>1?"s":""}, ${ratees} à revoir.</p>
        <p class="verso">Les cartes à revoir sont revenues en boîte 1 : elles passeront en tête à la prochaine session. Mieux vaut une courte session chaque jour qu'une longue de temps en temps.</p></div>
        <div class="row"><button class="act" id="again">Nouvelle session</button></div>`;
      o.lier(); document.getElementById("again").onclick=()=>sessionCartes(o); return;
    }
    const c=tirage[i];
    view.innerHTML=o.entete()+`<div class="card">
        <p class="src">Carte ${i+1} / ${tirage.length} · ${c.etiquette} · boîte ${boites[c.id]||1}${c.piege?' <span class="piege">piège</span>':""}</p>
        <p class="recto">${c.r}</p>
        <div class="verso" id="verso" hidden>${c.v}</div>
      </div>
      <div class="row" id="r1"><button class="act" id="voir">Voir la réponse</button></div>
      <div class="row" id="r2" hidden>
        <button class="act" id="su">Je savais</button>
        <button class="act ghost" id="rate">À revoir</button>
      </div>
      <p class="gate" style="text-align:left;margin-top:10px">Réponds d'abord dans ta tête, ou à voix haute, avant de retourner la carte.</p>`;
    o.lier();
    document.getElementById("voir").onclick=()=>{
      document.getElementById("verso").hidden=false;
      document.getElementById("r1").hidden=true; document.getElementById("r2").hidden=false;
    };
    document.getElementById("su").onclick=()=>{boites[c.id]=Math.min(5,(boites[c.id]||1)+1);o.sauver();sues++;i++;carte();};
    document.getElementById("rate").onclick=()=>{boites[c.id]=1;o.sauver();ratees++;i++;carte();};
  }
  carte(); window.scrollTo(0,0);
}

/* ============================================================
   EXAMEN DE NIVEAU
   Questions du champ "examen" de chaque module (jamais montrées pendant les modules)
   + exercices générés de tout le niveau. 80 % exigés. Corrigé détaillé à la fin.
   ============================================================ */
async function renderLevelExam(n){
  view.innerHTML=`<p class="sub">Chargement…</p>`;
  let L,mods;
  try{({L,mods}=await chargerNiveau(n));}catch(e){view.innerHTML=`<div class="err">Impossible de charger les modules du niveau.</div>`;return;}
  const TOTAL=20;
  const gens=[...new Set(mods.flatMap(m=>(m.sections||[]).filter(s=>s.exercise&&s.exercise.gen!=="qcm").map(s=>s.exercise.gen)))].filter(g=>GENERATORS[g]);
  /* modules au format 2 : les activités de l'évaluation qui se rejouent avec des valeurs neuves */
  const generatif=a=>!!a.gen||a.cible==="aleatoire"||a.valeur==="aleatoire"||(a.type==="operation"&&(a.a===undefined||a.a==="aleatoire"));
  const actsGen=mods.flatMap(m=>m.format===2?((m.evaluation&&m.evaluation.banque)||[]).filter(generatif).map(a=>({type:"act",spec:a,mod:m.id})):[]);
  const pool=mods.flatMap(m=>(m.examen||[]).map(q=>({...q,mod:m.id})));
  const genere=[...gens.map(g=>({type:"gen",g})),...actsGen].sort(()=>Math.random()-.5);
  const nGen=Math.min(8,genere.length?8:0);
  const nQ=Math.min(pool.length,TOTAL-nGen);
  const items=[];
  for(let i=0;i<nGen;i++) items.push(genere[i%genere.length]);
  pool.sort(()=>Math.random()-.5).slice(0,nQ).forEach(q=>items.push(q.type&&q.type!=="choix"?{type:"act",spec:q,mod:q.mod}:{type:"qcm",q:shuffleQ(q),mod:q.mod}));
  items.sort(()=>Math.random()-.5);
  const seuil=Math.ceil(items.length*0.8);

  view.innerHTML=`<p style="font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px">NIVEAU ${L.n} · EXAMEN</p>
    <h1>Examen — ${L.titre}</h1>
    <div class="why"><p><strong>Règles.</strong> ${items.length} questions tirées de tous les modules du niveau, dont des calculs générés et des questions que tu n'as jamais vues pendant les modules. Pas de retour en arrière, pas de correction avant la fin. Il faut <strong>${seuil} sur ${items.length}</strong> pour valider le niveau${CUR.niveaux.some(x=>x.n===L.n+1)?" et ouvrir le N"+(L.n+1):""}.${pool.length<TOTAL-nGen?" Banque de questions encore incomplète : "+pool.length+" questions d'examen disponibles.":""}</p></div>
    <div class="eval" style="margin-top:0"><div id="eval-body"></div></div>
    <div class="row"><button class="act ghost" id="back">Abandonner et revenir au sommaire</button></div>`;
  document.getElementById("back").onclick=renderIndex;
  const body=document.getElementById("eval-body");
  let i=0,good=0; const erreurs=[];

  function step(){
    if(i>=items.length){
      const ok=good>=seuil;
      if(ok){prog["examen-n"+L.n]=true;save();}
      const recap=erreurs.length?`<div class="recap"><h3>Corrigé de tes ${erreurs.length} erreur${erreurs.length>1?"s":""}</h3>${erreurs.join("")}</div>`:"";
      body.innerHTML=`<div class="pbar"><i style="width:100%"></i></div>
        <div class="big">${good} / ${items.length}</div>
        <p class="gate">${ok?"Niveau N"+L.n+" validé."+(CUR.niveaux.some(x=>x.n===L.n+1)?" Le N"+(L.n+1)+" est ouvert.":""):"Pas encore : il fallait "+seuil+". Lis le corrigé, révise les cartes des modules concernés, puis repasse l'examen."}</p>
        <div class="row" style="justify-content:center">
          <button class="act ghost" id="rev">Réviser les cartes</button>
          <button class="act" id="idx">Sommaire</button></div>${recap}`;
      document.getElementById("rev").onclick=()=>renderRevision(L.n);
      document.getElementById("idx").onclick=renderIndex;
      return;
    }
    const it=items[i];
    const head=`<div class="pbar"><i style="width:${i/items.length*100}%"></i></div>
      <p class="tag-ex" style="color:var(--muted)">Question ${i+1} / ${items.length}</p>`;
    if(it.type==="act"){
      body.innerHTML=head+`<div class="activite"></div>`;
      const el=body.querySelector(".activite");
      monterActivite(el,it.spec,{examen:true,fini(ok,html){
        const c=el.querySelector(".consigne");
        if(ok) good++;
        else erreurs.push(`<div class="corr" data-ok="0"><h4>Question ${i+1} · ${it.mod}${c?" — "+c.textContent:""}</h4>${html}</div>`);
        i++; step();
      }});
    }else if(it.type==="gen"){
      const x=GENERATORS[it.g]();
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 10px">${x.prompt}</p><p class="given">${x.given}</p>
        <div class="conv">${x.fields.map(f=>`<div class="cell"><span>${f.label}</span><input data-k="${f.k}" autocomplete="off" placeholder="${f.ph}"></div>`).join("")}</div>
        <div class="row"><button class="act" id="go">Valider</button></div>`;
      document.getElementById("go").onclick=()=>{
        let all=true; const tes=[];
        body.querySelectorAll("input[data-k]").forEach(inp=>{
          const k=inp.dataset.k;
          tes.push(inp.value.trim()||"—");
          if((x.norm?x.norm(inp.value,k):String(inp.value).trim())!==x.answers[k]) all=false;
        });
        if(all) good++;
        else erreurs.push(`<div class="corr" data-ok="0"><h4>Question ${i+1} — ${x.prompt}</h4><p>Énoncé : <b>${x.given}</b> · ta réponse : ${tes.join(" · ")}</p>${x.explain(false)}</div>`);
        i++; step();
      };
    }else{
      body.innerHTML=head+`<p style="font-size:15px;margin:0 0 12px">${it.q.q}</p><div class="opts"></div>`;
      const box=body.querySelector(".opts");
      it.q.o.forEach((t,j)=>{
        const b=document.createElement("button");
        b.className="opt";b.type="button";
        b.innerHTML=`<span class="k">${"ABCD"[j]}</span><span>${t}</span>`;
        b.onclick=()=>{
          if(j===it.q.a) good++;
          else erreurs.push(`<div class="corr" data-ok="0"><h4>Question ${i+1} · ${it.mod} — ${it.q.q}</h4><p>Ta réponse : ${t}<br>Bonne réponse : <b>${it.q.o[it.q.a]}</b></p><p>${it.q.w}</p></div>`);
          i++; step();
        };
        box.appendChild(b);
      });
    }
  }
  step(); window.scrollTo(0,0);
}

/* ============================================================
   SECTIONS ESGI — contenu dans esgi/*.json (schéma : esgi/SCHEMA.md)
   L'application ne fait que lire ces fichiers. Seules les boîtes des cartes
   sont écrites, sous leur propre clé, séparée de celle du parcours.
   ============================================================ */
const KEY_ESGI="formation.cyber.esgi.cartes.v1";
let boitesEsgi={};
try{const r=localStorage.getItem(KEY_ESGI); if(r) boitesEsgi=JSON.parse(r)||{};}catch(e){}
function saveBoitesEsgi(){try{localStorage.setItem(KEY_ESGI,JSON.stringify(boitesEsgi))}catch(e){}}
/* Identifiant d'une carte : matière + empreinte du recto. Une carte insérée au milieu du fichier
   ne décale pas la progression des autres ; une carte dont on réécrit le recto repart en boîte 1. */
function empreinte(s){let h=5381;for(const ch of String(s))h=((h*33)^ch.codePointAt(0))>>>0;return h.toString(36);}
let ESGI=null;
async function chargerEsgi(){
  if(ESGI) return ESGI;
  const r=await fetch("../esgi/matieres.json",{cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  const matieres=await r.json(), cartes={};
  /* l'index (outils/indexer.js) dit quelles matières ont des cartes : on ne demande que ces fichiers.
     S'il manque, on tente toutes les matières ; une absente répond 404 et compte 0 carte. */
  let avec=null;
  try{const x=await fetch("../esgi/cartes-index.json",{cache:"no-cache"});if(x.ok)avec=(await x.json()).cartes;}catch(e){}
  if(!Array.isArray(avec)) avec=matieres.map(m=>m.id);
  matieres.forEach(m=>{cartes[m.id]=[];});
  await Promise.all(matieres.filter(m=>avec.includes(m.id)).map(m=>fetch(`../esgi/cartes/${m.id}.json`,{cache:"no-cache"})
    .then(x=>x.ok?x.json():null).catch(()=>null)
    .then(d=>{cartes[m.id]=(d&&Array.isArray(d.cartes)?d.cartes:[]).map(c=>({...c,id:`${m.id}#${empreinte(c.r)}`}));})));
  ESGI={matieres,cartes};
  return ESGI;
}
/* modules du parcours cités par une matière ou une réalisation : cliquables s'ils sont écrits */
function pucesModules(ids){
  const titres=new Map([...CUR.niveaux.flatMap(l=>l.modules),...((CUR.hors_parcours||{}).modules||[])].map(x=>[x.id,x.titre]));
  return ids.map(x=>{
    const ecrit=INDEX.includes(x), ok=prog[x];
    return ecrit?`<a class="puce ${ok?"ok":""}" href="#m=${x}"><b>${x}</b> ${echap(titres.get(x)||"")}${ok?" · validé":""}</a>`
               :`<span class="puce absent"><b>${x}</b> ${echap(titres.get(x)||"")} · à écrire</span>`;
  }).join("");
}
const attente=c=>c.filter(x=>(boitesEsgi[x.id]||1)===1).length;
const dateFr=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"long",year:"numeric"});
const echap=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function erreurEsgi(){
  view.innerHTML=`<h1>Cours &amp; révision</h1><div class="err">Impossible de lire <code>esgi/matieres.json</code>. L'application doit être servie par un serveur local lancé à la racine du projet.</div>`;
}
/* bouton « copier » : le chemin reste aussi affiché et sélectionnable si le presse-papiers est refusé */
function brancherCopie(racine){
  racine.querySelectorAll("[data-copie]").forEach(b=>b.onclick=async()=>{
    const t=b.dataset.copie;
    try{await navigator.clipboard.writeText(t);b.textContent="Copié";}
    catch(e){const s=getSelection(),r=document.createRange();r.selectNodeContents(b.previousElementSibling);s.removeAllRanges();s.addRange(r);b.textContent="Sélectionné, Ctrl+C";}
    setTimeout(()=>{b.textContent="Copier le chemin";},1800);
  });
}
/* un support en ligne (plateforme, intranet) n'a pas de chemin à copier : bouton seulement pour un vrai chemin */
const estChemin=p=>/^[A-Za-z]:\\|^\\\\|^\//.test(p);
const cheminHtml=(p,rep)=>`<div class="chemin"><code>${echap(p)}</code>${estChemin(p)?`<button class="act ghost copie" type="button" data-copie="${echap(p)}">Copier le chemin</button>`:""}${rep?`<span class="reperes">${echap(rep)}</span>`:""}</div>`;

/* ---------- TP : échéances, compte à rebours, étapes cochables ----------
   "fait": true dans tp.json est l'état de référence : case cochée et verrouillée.
   Les cases cochées ici sont rangées sous formation.cyber.tp.v1, { "<tp>#<empreinte de l'étape>": true }. */
const KEY_TP="formation.cyber.tp.v1";
let tpCoches={};
try{const r=localStorage.getItem(KEY_TP); if(r) tpCoches=JSON.parse(r)||{};}catch(e){}
function saveTp(){try{localStorage.setItem(KEY_TP,JSON.stringify(tpCoches))}catch(e){}}
let TPS=null;
async function chargerTp(){
  if(TPS) return TPS;
  const r=await fetch("../esgi/tp.json",{cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  TPS=await r.json(); return TPS;
}
const STATUTS_TP={a_faire:"À faire",en_cours:"En cours",rendu:"Rendu",note:"Noté"};
/* une échéance sans heure vaut jusqu'au soir ; sans fuseau, c'est l'heure locale */
const dateEcheance=e=>new Date(e.includes("T")?e:e+"T23:59");
function compteARebours(e){
  const ms=dateEcheance(e)-Date.now(), abs=Math.abs(ms);
  const j=Math.floor(abs/864e5), h=Math.floor(abs%864e5/36e5), m=Math.floor(abs%36e5/6e4);
  const duree=j?`${j} j ${h} h`:h?`${h} h ${m} min`:`${m} min`;
  return {texte:ms<0?`dépassée de ${duree}`:`dans ${duree}`,urgent:ms<7*864e5,depasse:ms<0};
}
const cleEtape=(tp,e)=>`${tp.id}#${empreinte(e.t)}`;
const etapeFaite=(tp,e)=>e.fait||!!tpCoches[cleEtape(tp,e)];
function majComptes(){
  document.querySelectorAll(".compte[data-echeance]").forEach(el=>{
    const c=compteARebours(el.dataset.echeance); el.textContent=c.texte;
    const art=el.closest(".tp-carte"); if(art) art.classList.toggle("urgent",c.urgent);
  });
}
setInterval(majComptes,60000);
async function renderTp(){
  marquerOnglet("tp");
  view.innerHTML=`<p class="sub">Chargement…</p>`;
  let E,T; try{[E,T]=await Promise.all([chargerEsgi(),chargerTp()]);}
  catch(e){view.innerHTML=`<h1>TP</h1><div class="err">Impossible de lire <code>esgi/tp.json</code>.</div>`;return;}
  const nomMat=new Map(E.matieres.map(m=>[m.id,m.titre.split(" — ")[0]]));
  const actif=t=>t.statut==="a_faire"||t.statut==="en_cours";
  const actifs=T.filter(actif)
    .sort((a,b)=>(a.echeance?dateEcheance(a.echeance):Infinity)-(b.echeance?dateEcheance(b.echeance):Infinity));
  const finis=T.filter(t=>!actif(t));
  const carte=t=>{
    const c=t.echeance&&compteARebours(t.echeance);
    const faites=t.etapes.filter(e=>etapeFaite(t,e)).length;
    return `<article class="tp-carte ${c&&c.urgent&&actif(t)?"urgent":""}" data-tp="${t.id}">
      <p class="j-date">${echap(nomMat.get(t.matiere)||t.matiere)}</p>
      <div class="r-tete"><h3>${echap(t.titre)}</h3><span class="tp-statut s-${t.statut}">${STATUTS_TP[t.statut]}${t.note?" · "+echap(t.note):""}</span></div>
      ${actif(t)?`<p class="tp-echeance">${t.echeance?`Échéance : ${dateHeure(dateEcheance(t.echeance))} · <strong class="compte" data-echeance="${t.echeance}">${c.texte}</strong>`:"Échéance non annoncée"}</p>`:""}
      ${t.etapes.length?`<div class="tp-barre" role="progressbar" aria-valuemin="0" aria-valuemax="${t.etapes.length}" aria-valuenow="${faites}" aria-label="Étapes faites"><i style="width:${faites/t.etapes.length*100}%"></i></div>
        <p class="r-lab"><span class="tp-compte">${faites}</span> / ${t.etapes.length} étapes</p>
        <ul class="tp-etapes">${t.etapes.map((e,i)=>`<li><label class="${e.fait?"ref":""}"><input type="checkbox" data-etape="${i}" ${etapeFaite(t,e)?"checked":""} ${e.fait?'disabled title="Fait (état de référence)"':""}><span>${echap(e.t)}</span></label></li>`).join("")}</ul>`:""}
      ${(t.remarques||[]).length?`<ul class="tp-rem">${t.remarques.map(r=>`<li>${echap(r)}</li>`).join("")}</ul>`:""}
      ${t.enonce?`<p class="r-lab">Énoncé</p>${cheminHtml(t.enonce)}`:""}
      ${t.plateforme?`<p class="r-lab">Plateforme</p><p>${echap(t.plateforme)}</p>`:""}
    </article>`;
  };
  view.innerHTML=`<h1>TP</h1>
    <p class="sub">Les travaux pratiques en cours, par échéance. En rouge : échéance dans moins de 7 jours. Les cases grisées sont faites d'après les fichiers de l'école ; les autres se cochent ici.</p>
    ${actifs.length?actifs.map(carte).join(""):`<div class="vide">Aucun TP en cours.</div>`}

  view.querySelectorAll(".tp-etapes input:not([disabled])").forEach(cb=>cb.onchange=()=>{

    if(cb.checked) tpCoches[k]=true; else delete tpCoches[k];
    saveTp();
    const faites=t.etapes.filter(x=>etapeFaite(t,x)).length;

/* ---------- Contrôles : dates, périmètre, examen blanc ---------- */
let CTRL=null;
async function chargerControles(){
  if(CTRL) return CTRL;
  const r=await fetch("../esgi/controles.json",{cache:"no-cache"});
  if(!r.ok) throw new Error(r.status);
  CTRL=await r.json(); return CTRL;
}
/* jours entiers entre aujourd'hui et une date AAAA-MM-JJ (négatif si passée) */
function joursAvant(d){
  const a=new Date(Date.now()); a.setHours(0,0,0,0);
  return Math.round((new Date(d+"T00:00:00")-a)/864e5);
}
const texteJours=n=>n===0?"aujourd'hui":n===1?"demain":n>0?`dans ${n} j`:`il y a ${-n} j`;
/* titre du contrôle s'il en a un, sinon le nom de la matière */
const nomControle=(c,nomMat)=>c.titre||nomMat.get(c.matiere)||c.matiere;
function cartesDe(c,E){return c.cartes.flatMap(m=>(E.cartes[m]||[]).map(x=>({...x,matiere:m})));}

async function renderControles(){
  marquerOnglet("controles");
  view.innerHTML=`<p class="sub">Chargement…</p>`;
  let E,C; try{[E,C]=await Promise.all([chargerEsgi(),chargerControles()]);}
  catch(e){view.innerHTML=`<h1>Contrôles</h1><div class="err">Impossible de lire <code>esgi/controles.json</code>.</div>`;return;}
  const nomMat=new Map(E.matieres.map(m=>[m.id,m.titre.split(" — ")[0]]));
  /* à venir : par date, les dates inconnues à la fin ; passés : du plus récent au plus ancien */
  const venir=C.filter(c=>c.statut==="a_venir").sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  const passes=C.filter(c=>c.statut==="passe").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const carte=c=>{
    const n=c.date!==null?joursAvant(c.date):null, cartes=cartesDe(c,E);
    const proche=c.statut==="a_venir"&&n!==null&&n>=0&&n<7;
    return `<article class="tp-carte ${proche?"urgent":""}">
      <p class="j-date">${c.date?dateFr(c.date)+(c.statut==="a_venir"?" · <strong class=\"compte\">"+texteJours(n)+"</strong>":""):"Date inconnue"}</p>
      <div class="r-tete"><h3>${echap(nomControle(c,nomMat))}</h3>${c.note?`<span class="tp-statut s-note">${echap(c.note)}</span>`:`<span class="tp-statut">${c.statut==="passe"?"Passé":"À venir"}</span>`}</div>
      ${c.a_confirmer?`<p class="a-confirmer"><strong>À confirmer :</strong> ${echap(c.a_confirmer)}</p>`:""}
      ${c.format?`<p class="tp-echeance">${echap(c.format)}</p>`:""}
      ${c.perimetre.length?`<p class="r-lab">Périmètre</p><ul class="r-fait">${c.perimetre.map(p=>`<li>${echap(p)}</li>`).join("")}</ul>`:""}
      <div class="row">${cartes.length
        ?`<button class="act" data-blanc="${c.id}">Examen blanc</button><span class="info-blanc">${Math.min(20,cartes.length)} cartes tirées sur ${cartes.length}, 30 s par carte</span>`
        :`<span class="info-blanc">Examen blanc indisponible : pas encore de cartes pour ${c.cartes.map(m=>echap(nomMat.get(m)||m)).join(", ")}.</span>`}</div>
    </article>`;
  };
  view.innerHTML=`<h1>Contrôles</h1>
    <p class="sub">Les évaluations annoncées, par date. L'examen blanc tire 20 cartes des matières liées, 30 secondes par carte, sans rien enregistrer.</p>
    ${venir.length?venir.map(carte).join(""):`<div class="vide">Aucun contrôle annoncé.</div>`}
    ${passes.length?`<h2>Passés</h2>${passes.map(carte).join("")}`:""}`;
  view.querySelectorAll("[data-blanc]").forEach(b=>b.onclick=()=>examenBlanc(C.find(c=>c.id===b.dataset.blanc),E,nomMat));
  window.scrollTo(0,0);
}

/* Examen blanc : uniquement des cartes, 30 s chacune ; on s'auto-évalue après avoir vu la réponse.
   Temps écoulé = réponse montrée et comptée fausse. Rien n'est enregistré, les boîtes ne bougent pas. */
const DUREE_CARTE=30000;
function examenBlanc(c,E,nomMat){
  const toutes=cartesDe(c,E);
  const tirage=toutes.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).slice(0,20).map(o=>o.x);
  let i=0, bons=0, horloge=null; const rates=[];
  const titre=nomControle(c,nomMat);
  const arreter=()=>{if(horloge){clearInterval(horloge);horloge=null;}};
  function fin(){
    arreter();
    const pc=Math.round(bons/tirage.length*100);
    view.innerHTML=`<p class="fil"><a href="#controles">Contrôles</a> · examen blanc</p><h1>${echap(titre)}</h1>
      <div class="eval" style="margin-top:0"><div class="big">${bons} / ${tirage.length}</div><p class="gate">${pc} % · ${pc>=80?"Prêt sur ces cartes.":pc>=50?"Encore des trous : revois les cartes ci-dessous.":"À retravailler avant le contrôle."}</p>
      <div class="row" style="justify-content:center"><button class="act" id="refaire">Nouveau tirage</button><a class="act ghost lien-act" href="#controles">Retour aux contrôles</a></div></div>
      ${rates.length?`<div class="recap"><h3>À revoir (${rates.length})</h3>${rates.map(r=>`<div class="corr" data-ok="0"><h4>${r.c.piege?'<span class="piege">piège</span> ':""}${r.c.r}</h4><p>${r.c.v}</p><p class="f-src">${echap(r.c.source)}${r.temps?" · temps écoulé":""}</p></div>`).join("")}</div>`:""}`;
    document.getElementById("refaire").onclick=()=>examenBlanc(c,E,nomMat);
    window.scrollTo(0,0);
  }
  function suivante(){
    arreter();
    if(i>=tirage.length) return fin();
    const k=tirage[i], debut=Date.now();
    view.innerHTML=`<p class="fil"><a href="#controles">Contrôles</a> · examen blanc</p><h1>${echap(titre)}</h1>
      <div class="pbar"><i style="width:${i/tirage.length*100}%"></i></div>
      <div class="card"><p class="src">Carte ${i+1} / ${tirage.length} · <span id="reste">30 s</span></p>
        <div class="minuteur"><i id="jauge"></i></div>
        <p class="recto">${k.r}</p><div class="verso" id="verso" hidden>${k.v}</div></div>
      <div class="row" id="r1"><button class="act" id="voir">Voir la réponse</button></div>
      <div class="row" id="r2" hidden><button class="act" id="su">Je savais</button><button class="act ghost" id="rate">Je ne savais pas</button></div>
      <div class="row" id="r3" hidden><p class="gate" style="margin:0 12px 0 0;align-self:center">Temps écoulé.</p><button class="act" id="apres">Carte suivante</button></div>`;
    const montrer=()=>{arreter();document.getElementById("verso").hidden=false;document.getElementById("r1").hidden=true;};
    document.getElementById("voir").onclick=()=>{montrer();document.getElementById("r2").hidden=false;};
    document.getElementById("su").onclick=()=>{bons++;i++;suivante();};
    document.getElementById("rate").onclick=()=>{rates.push({c:k});i++;suivante();};
    document.getElementById("apres").onclick=()=>{i++;suivante();};
    horloge=setInterval(()=>{
      const jauge=document.getElementById("jauge");
      if(!jauge){arreter();return;}            /* on a quitté la page : on s'arrête */
      const reste=Math.max(0,DUREE_CARTE-(Date.now()-debut));
      jauge.style.width=reste/DUREE_CARTE*100+"%";
      document.getElementById("reste").textContent=Math.ceil(reste/1000)+" s";
      if(reste===0){montrer();rates.push({c:k,temps:true});document.getElementById("r3").hidden=false;}
    },200);
    window.scrollTo(0,0);
  }
  suivante();
}

/* rappel dans l'onglet Parcours : prochain TP et prochain contrôle datés */
async function remplirRappel(){
  let E,T,C; try{[E,T,C]=await Promise.all([chargerEsgi(),chargerTp(),chargerControles()]);}catch(e){return;}
  const el=document.getElementById("rappel-esgi"); if(!el) return;
  const nomMat=new Map(E.matieres.map(m=>[m.id,m.titre.split(" — ")[0]]));
  const tp=T.filter(t=>(t.statut==="a_faire"||t.statut==="en_cours")&&t.echeance&&dateEcheance(t.echeance)>Date.now())
    .sort((a,b)=>dateEcheance(a.echeance)-dateEcheance(b.echeance))[0];
  const ctrl=C.filter(c=>c.statut==="a_venir"&&c.date&&joursAvant(c.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];

  if(ctrl){const n=joursAvant(ctrl.date);lignes.push(`<a href="#controles" class="${n<7?"urgent":""}"><span>Prochain contrôle</span><b>${echap(nomControle(ctrl,nomMat))}</b> · ${dateFr(ctrl.date)} · ${texteJours(n)}${sansDate?` · ${sansDate} autre${sansDate>1?"s":""} sans date`:""}</a>`);}
  if(!lignes.length) return;
  el.innerHTML=lignes.join(""); el.hidden=false;
}
